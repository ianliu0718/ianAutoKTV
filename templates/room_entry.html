<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>ianAutoKTV｜建立或加入房間</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f8fafc; background: radial-gradient(circle at top, #263449, #10151f 55%); font: 16px/1.5 system-ui, "Microsoft JhengHei", sans-serif; }
        main { width: min(100%, 780px); }
        header { margin-bottom: 28px; text-align: center; }
        h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: .03em; }
        header p { margin: 0; color: #b9c5d5; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 18px; }
        section { padding: 26px; border: 1px solid #3a4758; border-radius: 18px; background: #1b2431eF; box-shadow: 0 18px 55px #0004; }
        .create-room-card { position: relative; }
        .create-room-card h2 { padding-right: 42px; }
        h2 { margin: 0 0 8px; font-size: 1.35rem; }
        section p { min-height: 48px; margin: 0 0 20px; color: #b9c5d5; }
        button { width: 100%; min-height: 50px; border: 0; border-radius: 10px; color: #071a16; background: #69e0bd; font: inherit; font-weight: 750; cursor: pointer; }
        button:hover { background: #8bf0d2; }
        .advanced-button { position: absolute; top: 16px; right: 16px; display: grid; place-items: center; width: 34px; min-height: 34px; padding: 0; border: 1px solid #53677d; border-radius: 9px; color: #d3deeb; background: #263449; font-size: 1.1rem; line-height: 1; }
        .advanced-button:hover { border-color: #69e0bd; color: #fff; background: #304158; }
        input { width: 100%; height: 52px; margin-bottom: 12px; padding: 0 14px; border: 1px solid #516174; border-radius: 10px; outline: none; color: white; background: #101722; font: inherit; font-size: 1.25rem; letter-spacing: .2em; text-align: center; }
        input:focus { border-color: #69e0bd; box-shadow: 0 0 0 3px #69e0bd33; }
        dialog { width: min(100% - 32px, 430px); padding: 24px; border: 1px solid #53677d; border-radius: 16px; color: #f8fafc; background: #1b2431; box-shadow: 0 18px 55px #0008; }
        dialog::backdrop { background: #050912bb; }
        dialog h2 { margin-bottom: 8px; }
        dialog p { margin: 0 0 16px; color: #b9c5d5; }
        .dialog-actions { display: flex; gap: 10px; }
        .dialog-actions button { min-height: 46px; }
        .dialog-actions .cancel-button { color: #e2e8f0; background: #3a4758; }
        .dialog-actions .cancel-button:hover { background: #4a5a70; }
        .error { margin: 0 0 18px; padding: 12px 14px; border: 1px solid #a44c55; border-radius: 10px; color: #ffd5d8; background: #61252b66; }
        footer { margin-top: 20px; color: #8f9daf; text-align: center; font-size: .9rem; }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>ianAutoKTV</h1>
            <p>建立一個 KTV 房間，或輸入房號加入朋友的房間</p>
        </header>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <div class="cards">
            <section class="create-room-card">
                <h2>建立房間</h2>
                <p>在這台裝置開啟播放器與遙控器一體機，建立後會取得一組 4 位數房號。</p>
                <form method="post" action="/api/rooms/create">
                    <button type="submit">建立房間並開啟一體機</button>
                </form>
                <button class="advanced-button" id="open-player-join" type="button"
                    aria-label="進階功能：以播放器加入房間" title="進階功能"
                    aria-haspopup="dialog" aria-controls="player-join-dialog">⚙</button>
            </section>
            <section>
                <h2>加入房間</h2>
                <p>輸入播放器畫面顯示的房號，這台手機或電腦就會成為遙控器。</p>
                <form method="post" action="/api/rooms/join">
                    <input name="room_code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" minlength="4" maxlength="4" placeholder="4 位數房號" aria-label="4 位數房號" required>
                    <button type="submit">加入並開啟遙控器</button>
                </form>
            </section>
        </div>
        <dialog id="player-join-dialog" aria-labelledby="player-join-title">
            <h2 id="player-join-title">加入房間成為另一台一體機</h2>
            <p>輸入目前房間的 4 位數房號。此設備將加入同一房間並接收相同的播放與控制廣播。請只將房號提供給可信任的人。</p>
            <form method="post" action="/api/rooms/join-player">
                <input name="room_code" type="text" inputmode="numeric" autocomplete="one-time-code"
                    pattern="[0-9]{4}" minlength="4" maxlength="4" placeholder="4 位數房號"
                    aria-label="要加入的一體機房號" required autofocus>
                <div class="dialog-actions">
                    <button class="cancel-button" type="button" id="cancel-player-join">取消</button>
                    <button type="submit">加入並開啟一體機</button>
                </div>
            </form>
        </dialog>
        <footer>掃描播放器上的 QR Code，也可以直接加入該房間。</footer>
    </main>
    <script>
        const playerJoinDialog = document.getElementById('player-join-dialog');
        document.getElementById('open-player-join').addEventListener('click', () => {
            playerJoinDialog.showModal();
            playerJoinDialog.querySelector('input').focus();
        });
        document.getElementById('cancel-player-join').addEventListener('click', () => {
            playerJoinDialog.close();
        });
        playerJoinDialog.addEventListener('click', (event) => {
            if (event.target === playerJoinDialog) playerJoinDialog.close();
        });
    </script>
</body>
</html>
