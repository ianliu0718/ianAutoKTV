<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 遙控器</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            padding: 10px;
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .drive-library-panel {
            width: min(760px, calc(100vw - 32px));
            max-height: calc(100dvh - 32px);
            box-sizing: border-box;
            margin: auto;
            position: relative;
            padding: 10px;
            border: 1px solid #2aa894;
            border-radius: 8px;
            background: #123c36;
            color: white;
            overflow-y: auto;
        }

        .drive-library-panel::backdrop { background: rgba(0, 0, 0, .65); }

        .drive-library-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            background: #455a64;
            font-size: 20px;
            line-height: 1;
        }

        .drive-library-panel h4 { margin: 0 0 6px; }
        .drive-library-status { color: #b8fff2; margin: 6px 0; font-size: 14px; }
        .drive-library-search { margin: 6px 0; }
        .drive-room-setup { display: grid; gap: 4px; margin: 8px 0 12px; }
        .drive-room-setup label { margin-top: 5px; font-size: 13px; }
        .drive-room-setup .btn {
            background: #dce9e3;
            border: 1px solid #a9c1b5;
            color: #263c32;
        }
        .drive-room-setup .btn:hover,
        .drive-room-setup .btn:focus-visible {
            background: #ccded5;
            border-color: #8eac9d;
            color: #1d3329;
        }
        .drive-library-list { list-style: none; padding: 0; margin: 6px 0 0; }
        .drive-library-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        .drive-library-row span { flex: 1; overflow-wrap: anywhere; }
        .drive-library-row button { width: auto; padding: 8px 10px; margin: 0; font-size: 14px; }

        /* 使用低飽和色搭配深色文字，降低雲端歌庫按鈕的刺眼感並提升辨識度。 */
        /* 下載／點歌使用柔和暖色，與重新整理按鈕形成清楚但不刺眼的功能區分。 */
        .drive-library-row button {
            background: #f0dfc5;
            border: 1px solid #d2b98e;
            color: #5f4728;
        }

        .drive-library-row button:hover,
        .drive-library-row button:focus-visible {
            background: #e7cfaa;
            border-color: #c6a574;
            color: #4d381f;
        }

        .drive-library-row button:disabled {
            background: #c8c6c0;
            border-color: #aaa7a0;
            color: #66645f;
            cursor: wait;
        }

        .play {
            background: #2196F3;
        }

        .pause {
            background: #2196F3;
        }

        .stop {
            background: #2196F3;
        }

        .vocal {
            background: #ff9800;
        }

        .inst {
            background: #ff9800;
        }

        .toggle-panel {
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #2aa894;
            border-radius: 6px;
            background: #123c36;
            margin-bottom: 8px;
        }

        .settings-trigger {
            position: absolute;
            top: 50%;
            right: 0;
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transform: translateY(-50%);
            border-radius: 6px;
            background: #607D8B;
            font-size: 18px;
            line-height: 1;
        }

        .settings-trigger:focus-visible { outline: 2px solid #b8fff2; outline-offset: 2px; }

        /* 雲端歌庫按鈕固定在標題左側，與右側設定按鈕形成對稱入口。 */
        .drive-library-trigger {
            position: absolute;
            top: 50%;
            left: 0;
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transform: translateY(-50%);
            border-radius: 6px;
            background: #5b837a;
            border: 1px solid #7eaa9f;
            color: #ffffff;
            font-size: 18px;
            line-height: 1;
        }

        .drive-library-trigger:hover,
        .drive-library-trigger:focus-visible {
            background: #6c958b;
            border-color: #9bc0b6;
            color: #ffffff;
        }

        .settings-panel {
            width: min(420px, calc(100vw - 32px));
            max-height: calc(100dvh - 32px);
            margin: auto;
            padding: 14px;
            overflow-y: auto;
            color: white;
        }

        .settings-panel::backdrop {
            background: rgba(0, 0, 0, .65);
        }

        .settings-panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .settings-panel-heading h3 {
            margin: 0;
            color: #b8fff2;
        }

        .settings-close-button {
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            background: #455a64;
            font-size: 20px;
        }

        .settings-options {
            display: grid;
            gap: 8px;
        }

        .settings-options .setting-button {
            min-height: 42px;
            margin: 0;
            padding: 10px 12px;
        }

        .remote-header {
            position: relative;
            margin-bottom: 10px;
            text-align: center;
        }

        input[type=text] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }

        input[type=range] {
            width: 100%;
        }

        li {
            background: #333;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        .queue-box {
            background: #111;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            margin: 10px 0;
            max-height: 30vh;
            overflow: hidden;
        }

        .queue-title {
            color: #4CAF50;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        #queue-list {
            max-height: calc(30vh - 52px);
            margin: 0;
            padding-left: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #queue-list li {
            background: none;
            padding: 4px 0;
            margin: 0;
            display: list-item;
            list-style-type: decimal;
            color: #aaa;
            overflow-wrap: anywhere;
        }

        .song-btn {
            background: #009688;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
        }

        .song-btn.added {
            background: #607d8b;
            cursor: wait;
        }

        .song-status {
            margin-right: 6px;
            color: #80cbc4;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .song-audio-exception {
            color: #ffcc80;
            font-size: 12px;
            font-weight: bold;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .song-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            max-width: 60%;
        }

        .song-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        li.song-playing {
            background: #174d48;
            border: 1px solid #26a69a;
        }

        li.song-row {
            cursor: pointer;
        }

        li.song-row:hover {
            background: #34514e;
        }

        li.song-added {
            border: 1px solid #4caf50;
            box-shadow: 0 0 0 1px rgba(76, 175, 80, 0.25);
        }

        .category-filters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .category-filters select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }

        .category-multi-filter {
            position: relative;
            min-width: 0;
        }

        .category-multi-filter summary {
            overflow: hidden;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
            list-style: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-multi-filter summary::-webkit-details-marker {
            display: none;
        }

        .category-multi-filter summary::after {
            content: '▾';
            float: right;
            margin-left: 6px;
        }

        .category-multi-filter[open] summary::after {
            content: '▴';
        }

        .category-multi-options {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            left: 0;
            z-index: 40;
            display: grid;
            gap: 2px;
            max-height: min(40vh, 280px);
            overflow-y: auto;
            padding: 6px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .45);
        }

        .category-multi-filter:not([open]) .category-multi-options {
            display: none;
        }

        .category-multi-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
            padding: 3px 4px;
            color: #eee;
            overflow-wrap: anywhere;
        }

        .category-multi-option input {
            flex: 0 0 auto;
            width: auto;
            margin: 0;
        }

        .search-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }

        .search-row input[type=text] {
            flex: 1;
            min-width: 0;
            margin-bottom: 10px;
        }

        .sort-mode-button {
            flex: 0 0 auto;
            width: auto;
            margin: 0 0 10px;
            padding: 10px 9px;
            background: #4b5d58;
            border: 1px solid #72817d;
            color: #f1f4f3;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 2px 5px rgba(0, 0, 0, .2);
        }

        .sort-mode-button:hover {
            background: #596b66;
            border-color: #8a9a95;
        }

        .sort-mode-button:focus-visible {
            outline: 2px solid #a6b2ae;
            outline-offset: 2px;
        }

        .clear-filter-button {
            width: auto;
            margin: 0 0 10px;
            padding: 10px 14px;
            background: #607D8B;
            white-space: nowrap;
        }

        .tab-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: -10px -10px 10px;
            padding: 10px;
            background: #1a1a1a;
        }

        .tab-button {
            width: 100%;
            padding: 12px 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #333;
            color: #bbb;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            background: #009688;
            border-color: #34cdbd;
            color: white;
        }

        .song-tools {
            position: sticky;
            top: 60px;
            z-index: 9;
            padding-top: 4px;
            background: #1a1a1a;
        }

        .setting-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .setting-button {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 46px;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            background: #333;
            color: #ccc;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .setting-button input {
            width: auto;
            flex: 0 0 auto;
        }

        .tab-panel[hidden] {
            display: none;
        }

        /* 待播歌曲備註面板，採用固定面板避免推動遙控器內容。 */
        #song-note-panel {
            display: none;
            position: fixed;
            inset: 10% 5% auto;
            z-index: 20;
            background: #222;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
        }

        #song-note-panel h4 {
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        #song-note-panel label {
            display: block;
            margin: 10px 0;
            color: #ddd;
        }

        #song-note-panel textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }

        #song-note-panel textarea {
            min-height: 80px;
            resize: vertical;
        }

        .note-key-controls {
            display: flex;
            gap: 8px;
        }

        .note-key-controls .btn {
            margin: 0;
            flex: 1;
            padding: 10px;
        }

        .note-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .note-actions .btn {
            margin: 0;
            flex: 1;
            padding: 10px;
        }

        .note-indicator {
            color: #ffd54f;
            margin-left: 6px;
        }

        .danmaku-button {
            background: #e91e63;
        }

        .sound-effect-button {
            background: #00897b;
        }

        #danmaku-panel {
            display: none;
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: 5%;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 5%;
            box-sizing: border-box;
            overflow: hidden;
            z-index: 30;
            background: #222;
            border: 1px solid #777;
            border-radius: 8px;
            padding: 15px;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .65);
        }

        #danmaku-panel h4 {
            margin: 0 0 12px;
        }

        .emotion-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
        }

        .emotion-tab {
            min-width: 0;
            margin: 0;
            padding: 8px 3px;
            border: 1px solid transparent;
            border-bottom: 3px solid transparent;
            border-radius: 6px 6px 0 0;
            background: transparent;
            color: #999;
            font-size: 12px;
            font-weight: normal;
            white-space: nowrap;
            box-shadow: none;
        }

        .emotion-tab.active {
            background: #333;
            border-color: #555;
            border-bottom-color: #2aa894;
            color: #b8fff2;
            font-weight: bold;
        }

        .emotion-tab-panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .emotion-tab-panel[hidden] {
            display: none;
        }

        .photo-picker {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
            padding: 10px 0;
            color: #ccc;
        }

        .photo-picker input[type=file] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 6px;
        }

        .photo-picker-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .photo-picker-actions .btn {
            margin: 0;
        }

        .photo-upload-button {
            background: #00695c;
            color: #fff;
            border: 1px solid #4db6ac;
        }

        .photo-upload-button:hover {
            background: #00897b;
        }

        .photo-camera-button {
            background: #1565c0;
            color: #fff;
            border: 1px solid #64b5f6;
        }

        .photo-camera-button:hover {
            background: #1976d2;
        }

        .photo-picker-actions .btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        .photo-preview {
            display: none;
            max-width: 100%;
            max-height: 30vh;
            margin: 0 auto;
            border-radius: 8px;
            object-fit: contain;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 8px 0;
        }

        .sticker-option {
            aspect-ratio: 1;
            min-width: 0;
            margin: 0;
            padding: 5px;
            border: 1px solid #555;
            background-color: #333;
            background-image: radial-gradient(#555 0.7px, transparent 0.7px);
            background-size: 8px 8px;
        }

        .sticker-option:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        .sticker-option img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sticker-preview {
            display: none;
            max-width: 100%;
            height: 90px;
            margin: 8px auto 0;
            object-fit: contain;
        }

        .sticker-picker-status {
            margin: 4px 0 0;
            color: #ccc;
            text-align: center;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .danmaku-presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .danmaku-presets .btn {
            margin: 0;
            padding: 10px 6px;
            background: #5c3b6f;
        }

        .effect-section {
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }

        .effect-section-title {
            margin-bottom: 8px;
            color: #b8fff2;
            font-size: 14px;
            font-weight: bold;
        }

        .sound-effect-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sound-effect-list .btn {
            margin: 0;
            padding: 10px 6px;
        }

        .subtitle-controls-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
        }

        .subtitle-controls-row .btn {
            min-height: 34px;
            margin: 0;
            padding: 6px 4px;
            font-size: 12px;
        }

        .subtitle-size-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #b8fff2;
            font-size: 12px;
            gap: 8px;
        }

        .subtitle-size-value {
            min-width: 48px;
            text-align: right;
            color: #f9f9c5;
            font-weight: 700;
        }

        .subtitle-size-controls {
            display: flex;
            gap: 6px;
        }

        .subtitle-size-btn {
            flex: 1;
            min-width: 44px;
            min-height: 34px;
            margin: 0;
            padding: 6px 8px;
            border-radius: 6px;
            background: linear-gradient(180deg, #607d8b 0%, #4f6775 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        .subtitle-size-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #danmaku-custom-text {
            width: 100%;
            box-sizing: border-box;
            margin-top: 12px;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }

        .danmaku-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .danmaku-actions .btn {
            flex: 1;
            margin: 0;
        }

        .emotion-footer {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #555;
        }

        .emotion-footer .btn {
            flex: 1;
            margin: 0;
            min-height: 46px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
</head>

<body>
    <div class="remote-header">
        <button id="drive-library-toggle" class="btn drive-library-trigger" type="button"
            aria-label="開啟 Google Drive 歌庫" aria-expanded="false" aria-controls="drive-library-panel"
            title="Google Drive 歌庫">☁️</button>
        <h3 style="margin:0;">📱 KTV 遙控器</h3>
        <small style="color:#aaa;">已連線至主機</small>
        <button class="btn settings-trigger" type="button" aria-label="開啟設定" title="設定"
            onclick="openRemoteSettings()">⚙️</button>
    </div>

    <div class="tab-bar" role="tablist" aria-label="遙控器功能分頁">
        <button id="song-tab" class="tab-button active" role="tab" aria-selected="true" aria-controls="song-panel"
            onclick="switchTab('song')">🎶 點歌</button>
        <button id="control-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="control-panel"
            onclick="switchTab('control')">🎛️ 實際遙控</button>
    </div>

    <section id="song-panel" class="tab-panel" role="tabpanel" aria-labelledby="song-tab">
        <div class="song-tools">
            <div class="search-row">
                <!-- 點歌排序依新歌、熱門、國語、台語循環。 -->
                <button type="button" id="song-sort-mode" class="btn sort-mode-button"
                    onclick="cycleSongSortMode()">新歌</button>
                <input type="text" id="search" placeholder="🔍 搜尋歌曲..." oninput="handleSearchInput()">
                <button type="button" class="btn clear-filter-button" onclick="clearFilters()">清除篩選</button>
            </div>
            <div class="category-filters">
                <select id="song-length-filter" aria-label="依歌曲名稱字數分類" onchange="handleCategoryChange()">

    <script>
        const socket = io();
        const cloudMode = {{ cloud_mode|tojson }};
        let allSongs = [];
        let sortedSongMetadata = [];
        let songPlayCounts = {};
        let songSortModeIndex = 0;
        let songAudioExceptions = {};
        let subtitleSongs = new Set();
        let currentKey = 0;
        let currentPlayingFilename = '';
        let currentTrackMode = 'original';
        let guideVocalControlSupported = false;
        let currentVocalLevel = 50;
        let currentSubtitleMode = 0;
        const subtitleDisplayLabels = ['隱藏', '一般', '單行', '雙行', '雙行漸變'];
        let currentSubtitleFontSize = 120;
        let currentSubtitleStyleMode = 0;
        const subtitleStyleLabels = ['背景', '陰影'];
        let songScrollTop = 0;
        let seekOffset = 0;
        let seekCorrectionEnabled = false;
        let currentPlaylist = [];
        let songNotes = {};
        let editingSongFilename = '';
        let editingNoteKeyValue = 0;
        const pendingSongs = new Set();
        let driveLibrarySongs = [];
        const qrVisibility = document.getElementById('qr-visibility');
        const randomPlay = document.getElementById('random-play');
        const screenWakeLock = document.getElementById('screen-wake-lock');
        let screenWakeLockSentinel = null;
        let screenWakeLockEnabled = localStorage.getItem('ktv-screen-wake-lock') !== 'false';

        /** Requests the browser to keep this phone or tablet screen awake. */
        async function requestScreenWakeLock() {
            if (!('wakeLock' in navigator)) {
                screenWakeLock.disabled = true;
                screenWakeLock.checked = false;
                screenWakeLockEnabled = false;
                return false;
            }
            try {
                screenWakeLockSentinel = await navigator.wakeLock.request('screen');
                screenWakeLockSentinel.addEventListener('release', () => {
                    screenWakeLockSentinel = null;
                    if (screenWakeLockEnabled && document.visibilityState === 'visible') {
                        requestScreenWakeLock();
                    }
                }, { once: true });
                return true;
            } catch (error) {
                screenWakeLockSentinel = null;
                return false;
            }
        }

        function releaseScreenWakeLock() {
            if (screenWakeLockSentinel) {
                screenWakeLockSentinel.release();
                screenWakeLockSentinel = null;
            }
        }

        async function setScreenWakeLock(enabled) {
            screenWakeLockEnabled = Boolean(enabled);
            localStorage.setItem('ktv-screen-wake-lock', String(screenWakeLockEnabled));
            if (screenWakeLockEnabled) {
                const acquired = await requestScreenWakeLock();
                screenWakeLock.checked = acquired;
                if (!acquired) screenWakeLockEnabled = false;
            } else {
                releaseScreenWakeLock();
                screenWakeLock.checked = false;
            }
        }

        screenWakeLock.checked = screenWakeLockEnabled;
        screenWakeLock.addEventListener('change', () => setScreenWakeLock(screenWakeLock.checked));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && screenWakeLockEnabled && !screenWakeLockSentinel) {
                requestScreenWakeLock().then((acquired) => { screenWakeLock.checked = acquired; });
            }
        });
        if (screenWakeLockEnabled) setScreenWakeLock(true);

        /**
         * Switches between song selection and playback control panels.
         * @param {'song'|'control'} tabName Panel identifier to display.
         */
        function switchTab(tabName) {
            const isSongTab = tabName === 'song';
            if (!isSongTab) songScrollTop = window.scrollY;
            document.getElementById('song-panel').hidden = !isSongTab;
            document.getElementById('control-panel').hidden = isSongTab;
            document.getElementById('song-tab').classList.toggle('active', isSongTab);
            document.getElementById('control-tab').classList.toggle('active', !isSongTab);
            document.getElementById('song-tab').setAttribute('aria-selected', String(isSongTab));
            document.getElementById('control-tab').setAttribute('aria-selected', String(!isSongTab));
            if (isSongTab) {
                requestAnimationFrame(() => window.scrollTo(0, songScrollTop));
            }
        }

        /** Opens the remote-only settings panel. */
        function openRemoteSettings() {
            const settingsPanel = document.getElementById('remote-settings-panel');
            if (!settingsPanel.open) settingsPanel.showModal();
        }

        /** Closes the remote-only settings panel. */
        function closeRemoteSettings() {
            const settingsPanel = document.getElementById('remote-settings-panel');
            if (settingsPanel.open) settingsPanel.close();
        }

        /**
         * Renders the server's current queue for the remote control screen.
         * @param {string[]} playlist Ordered filenames, with the currently playing song first.
         */
        function renderQueue(playlist) {
            currentPlaylist = Array.isArray(playlist) ? playlist : [];
            const queueList = document.getElementById('queue-list');
            queueList.innerHTML = '';
            if (!currentPlaylist.length) {
                queueList.innerHTML = '<li>(無)</li>';
            } else {
                currentPlaylist.forEach((filename, index) => {
                    const item = document.createElement('li');
                    const name = index === 0 ? `播放中：${filename.replace('.mp4', '')}` : filename.replace('.mp4', '');
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = name;
                    item.appendChild(nameSpan);
                    if (hasMeaningfulSongNote(songNotes[filename])) {
                        const noteIndicator = document.createElement('span');
                        noteIndicator.className = 'note-indicator';
                        noteIndicator.textContent = '📝';
                        nameSpan.appendChild(noteIndicator);
                    }
                    const noteButton = document.createElement('button');
                    noteButton.className = 'song-btn';
                    noteButton.textContent = '備註';
                    noteButton.addEventListener('click', () => openSongNote(filename));
                    item.appendChild(noteButton);
                    if (index === 0) {
                        item.style.color = '#4CAF50';
                    } else {
                        const removeButton = document.createElement('button');
                        removeButton.className = 'song-btn';
                        removeButton.textContent = '刪除';
                        removeButton.addEventListener('click', () => removeQueuedSong(index));
                        item.appendChild(removeButton);
                    }
                    queueList.appendChild(item);
                });
            }
            filter();
        }

        // 只有備註真的有內容時才顯示提示圖示，避免空白儲存也出現圖案。
        function hasMeaningfulSongNote(note) {
            return Boolean(note && (
                (Array.isArray(note.selected_options) && note.selected_options.length > 0)
                || (note.key_value && note.key_value !== '原 Key')
                || String(note.custom_text || '').trim()
            ));
        }

        // 開啟指定待播歌曲的備註面板，資料來源只限該歌曲檔名。
        function openSongNote(filename) {
            editingSongFilename = filename;
            const note = songNotes[filename] || {};
            document.getElementById('song-note-title').textContent = `歌曲備註：${filename.replace('.mp4', '')}`;
            const hasSubtitle = subtitleSongs.has(filename);
            const lyricsOption = hasSubtitle ? '歌詞錯誤待修改' : '想加入歌詞';
            document.getElementById('note-lyrics-label').lastChild.textContent = ` ${lyricsOption}`;
            document.getElementById('note-lyrics').checked = (note.selected_options || []).some((option) => option === lyricsOption || (hasSubtitle && option === '想加入歌詞'));
            editingNoteKeyValue = parseNoteKey(note.key_value);
            renderNoteKeyValue();
            document.getElementById('note-custom-text').value = note.custom_text || '';
            document.getElementById('song-note-panel').style.display = 'block';
        }

        function parseNoteKey(value) {
            const keyNumber = Number.parseInt(String(value || '0').replace('原 Key', '0'), 10);
            return Number.isFinite(keyNumber) ? Math.max(-12, Math.min(12, keyNumber)) : 0;
        }

        function renderNoteKeyValue() {
            const label = editingNoteKeyValue === 0 ? '原 KEY' : `${editingNoteKeyValue > 0 ? '+' : ''}${editingNoteKeyValue}`;
            document.getElementById('note-key-value').textContent = label;
        }

        // 透過左右按鈕快速調整半音，連續點擊即可設定 +2、-2 等數值。
        function adjustNoteKey(step) {
            editingNoteKeyValue = Math.max(-12, Math.min(12, editingNoteKeyValue + step));
            renderNoteKeyValue();
        }

        function resetNoteKey() {
            editingNoteKeyValue = 0;
            renderNoteKeyValue();
        }

        function closeSongNote() {
            document.getElementById('song-note-panel').style.display = 'none';
            editingSongFilename = '';
        }

        function openDanmakuPanel() {
            switchEmotionTab('danmaku');
            document.getElementById('danmaku-panel').style.display = 'flex';
        }

        function switchEmotionTab(tabName) {
            activeEmotionTab = ['danmaku', 'sound', 'photo', 'sticker'].includes(tabName) ? tabName : 'danmaku';
            ['danmaku', 'sound', 'photo', 'sticker'].forEach((name) => {
                const active = activeEmotionTab === name;
                document.getElementById(`emotion-panel-${name}`).hidden = !active;
                document.getElementById(`emotion-tab-${name}`).classList.toggle('active', active);
                document.getElementById(`emotion-tab-${name}`).setAttribute('aria-selected', String(active));
            });
            document.getElementById('emotion-submit-button').hidden = activeEmotionTab === 'sticker';
            if (activeEmotionTab === 'sticker') loadEmotionStickers();
        }

        let activeEmotionTab = 'danmaku';
        let pendingEmotionPhoto = '';
        let emotionStickerListPromise = null;
        let emotionStickerLocked = false;
        let emotionStickerRequestId = 0;

        function sendEmotionAction() {
            if (activeEmotionTab === 'photo') sendEmotionPhoto();
            else if (activeEmotionTab === 'sticker') return;
            else if (activeEmotionTab === 'danmaku') sendCustomDanmaku();
        }

        function loadEmotionStickers() {
            if (emotionStickerListPromise) return;
            const grid = document.getElementById('emotion-sticker-grid');
            const status = document.getElementById('emotion-sticker-status');
            emotionStickerListPromise = fetch('/api/stickers')
                .then((response) => response.ok ? response.json() : Promise.reject(new Error('貼圖清單載入失敗')))
                .then((stickers) => {
                    grid.replaceChildren();
                    stickers.forEach((filename) => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'btn sticker-option';
                        button.setAttribute('aria-label', `立即送出貼圖 ${filename}`);
                        const image = document.createElement('img');
                        image.src = `/static/stickers/${encodeURIComponent(filename)}`;
                        image.alt = '';
                        image.loading = 'lazy';
                        button.appendChild(image);
                        button.addEventListener('click', () => sendEmotionSticker(filename));
                        grid.appendChild(button);
                    });
                    status.textContent = stickers.length ? `點擊貼圖即可直接送出（${stickers.length} 張）` : '目前沒有可用貼圖。';
                })
                .catch((error) => {
                    emotionStickerListPromise = null;
                    status.textContent = error.message;
                });
        }

        function sendEmotionSticker(filename) {
            if (emotionStickerLocked) return;
            emotionStickerLocked = true;
            const requestId = ++emotionStickerRequestId;

        function prepareEmotionPhoto(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const image = new Image();
            image.onload = () => {
                const scale = Math.min(1, 1280 / Math.max(image.width, image.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                pendingEmotionPhoto = canvas.toDataURL('image/jpeg', 0.82);
                const preview = document.getElementById('emotion-photo-preview');
                preview.src = pendingEmotionPhoto;
                preview.style.display = 'block';
            };
            image.src = URL.createObjectURL(file);

        function hasSubtitleForSong(filename) {
            const normalized = String(filename || '').toLowerCase().replace(/\.mp4$/, '');
            return [...subtitleSongs].some((song) =>
                String(song || '').toLowerCase().replace(/\.mp4$/, '') === normalized
            );

        function normalizePlayingSongFilename(filename) {
            const value = String(filename || '').trim();
            return value && !/\.mp4$/i.test(value) ? `${value}.mp4` : value;
        }

        /**
         * Parses the fixed song filename format into classification fields.
         * @param {string} filename Song filename in song-singer-language-id.mp4 format.
         * @returns {Object} Song metadata with title, singer, language, and length fields.
         */
        function parseSongMetadata(filename) {
            const name = filename.replace(/\.mp4$/i, '');
            const parts = name.split('-');
            if (parts.length < 2) return { title: name, singer: '未辨識', language: '未辨識', length: '未辨識', code: null, affiliation: '未標記' };
            const title = parts[0];
            const code = /^\d+$/.test(parts[3] || '') ? Number(parts[3]) : null;
            const affiliation = parts.length > 4 ? parts.slice(4).join('-') : '未標記';
            return {
                title,
                singer: parts[1] || '未辨識',
                language: parts[2] || '未辨識',
                length: String(Array.from(title).length),
                code,
                affiliation,
            };
        }

        /**
         * Extracts the final numeric song code used for reverse sorting.
         * @param {string} filename Song filename.
         * @returns {number|null} Numeric song code, or null when unavailable.
         */
        function getSongCode(filename) {
            return parseSongMetadata(filename).code;
        }

        /**
         * Sorts songs with unknown codes first, then numeric codes descending.
         * @param {string} firstFilename First song filename.
         * @param {string} secondFilename Second song filename.
         * @returns {number} Sort comparison result.
         */
        function compareSongCodeDescending(firstFilename, secondFilename) {
            const firstCode = getSongCode(firstFilename);
            const secondCode = getSongCode(secondFilename);
            if (firstCode === null && secondCode === null) return firstFilename.localeCompare(secondFilename, 'zh-Hant');
            if (firstCode === null) return -1;
            if (secondCode === null) return 1;
            return secondCode - firstCode || firstFilename.localeCompare(secondFilename, 'zh-Hant');
        }

        /** Returns the language filter required by the active language sort mode. */
        function getSongSortLanguage() {
            return songSortModeIndex === 3 ? '國' : songSortModeIndex === 4 ? '台' : '';
        }

        /** Keeps the visible language selector aligned with the active sort mode. */
        function setSongSortLanguage(language) {
            const languageFilter = document.getElementById('language-filter');
            if (language && ![...languageFilter.options].some((option) => option.value === language)) {
                const option = document.createElement('option');
                option.value = language;
                option.textContent = language;
                languageFilter.appendChild(option);
            }
            languageFilter.value = language;
        }

        /** Sorts visible songs by playback starts or by the existing reverse song-code rule. */
        function sortSongEntries(songs) {
            return [...songs].sort((firstSong, secondSong) => {
                if (songSortModeIndex === 0) return compareSongCodeDescending(firstSong.filename, secondSong.filename);
                const firstPlayCount = Number(songPlayCounts[firstSong.filename]) || 0;
                const secondPlayCount = Number(songPlayCounts[secondSong.filename]) || 0;
                const playCountDifference = songSortModeIndex === 2
                    ? firstPlayCount - secondPlayCount
                    : secondPlayCount - firstPlayCount;
                return playCountDifference || compareSongCodeDescending(firstSong.filename, secondSong.filename);
            });
        }

        /** Cycles five sort modes and applies the language selector when needed. */
        function cycleSongSortMode() {
            const previousLanguage = getSongSortLanguage();
            songSortModeIndex = (songSortModeIndex + 1) % 5;
            if (previousLanguage && document.getElementById('language-filter').value === previousLanguage) {
                setSongSortLanguage('');
            }
            const nextLanguage = getSongSortLanguage();
            if (nextLanguage) setSongSortLanguage(nextLanguage);
            document.getElementById('song-sort-mode').textContent = ['新歌', '熱門', '冷門', '國語', '台語'][songSortModeIndex];
            renderCategoryFilters();
            filter();
        }

        function setSongList(songs) {
            allSongs = Array.isArray(songs) ? songs : [];
            sortedSongMetadata = allSongs.map((filename) => ({ filename, metadata: parseSongMetadata(filename) }))
                .sort((firstSong, secondSong) => compareSongCodeDescending(firstSong.filename, secondSong.filename));
        }

        /** Rebuilds each category from search results matching every other selected category. */
        function renderCategoryFilters() {
            const lengthFilter = document.getElementById('song-length-filter');
            const singerFilter = document.getElementById('singer-filter');
            const languageFilter = document.getElementById('language-filter');
            const affiliationFilter = document.getElementById('affiliation-filter');
            const affiliationOptions = document.getElementById('affiliation-filter-options');
            const affiliationSummary = affiliationFilter.querySelector('summary');
            const selectedAffiliations = getSelectedAffiliations();
            const filters = [lengthFilter, singerFilter, languageFilter];
            const previous = filters.map((filterElement) => filterElement.value);
            const fields = ['length', 'singer', 'language', 'affiliation'];
            const query = document.getElementById('search').value.toLowerCase();
            const matchingSongs = sortedSongMetadata.filter(({ filename }) => filename.toLowerCase().includes(query));
            const valuesForFilter = (filterIndex) => [...new Set(matchingSongs
                .filter(({ metadata }) => previous.every((value, index) => index === filterIndex || !value || metadata[fields[index]] === value)
                    && (filterIndex === 3 || !selectedAffiliations.size || selectedAffiliations.has(metadata.affiliation)))
                .map(({ metadata }) => metadata[fields[filterIndex]]))];
            const lengths = valuesForFilter(0).sort((a, b) => Number(a) - Number(b));
            const singers = valuesForFilter(1).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const languages = valuesForFilter(2);
            const sortLanguage = getSongSortLanguage();
            if (sortLanguage && !languages.includes(sortLanguage)) languages.push(sortLanguage);
            languages.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const affiliations = valuesForFilter(3).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const availableAffiliations = new Set(affiliations);
            const validSelections = new Set([...selectedAffiliations].filter(value => availableAffiliations.has(value)));
            lengthFilter.innerHTML = '<option value="">歌曲字數：全部</option>' + lengths.map(value => `<option value="${value}">${value === '未辨識' ? value : `${value} 字`}</option>`).join('');
            singerFilter.innerHTML = '<option value="">主唱者：全部</option>' + singers.map(value => `<option value="${value}">${value}</option>`).join('');
            languageFilter.innerHTML = '<option value="">語言：全部</option>' + languages.map(value => `<option value="${value}">${value}</option>`).join('');
            filters.forEach((filterElement, index) => { filterElement.value = previous[index]; });
            affiliationOptions.replaceChildren();
            affiliations.forEach((value) => {
                const label = document.createElement('label');
                label.className = 'category-multi-option';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = value;
                checkbox.checked = validSelections.has(value);
                checkbox.addEventListener('change', handleCategoryChange);
                const text = document.createElement('span');
                text.textContent = value;
                label.append(checkbox, text);
                affiliationOptions.appendChild(label);
            });
            affiliationSummary.textContent = validSelections.size ? `歸屬：${validSelections.size} 項` : '歸屬：全部';
            if (filters.some((filterElement, index) => filterElement.value !== previous[index]) || validSelections.size !== selectedAffiliations.size) {
                renderCategoryFilters();
            }
        }

        /**

        /**

        function songAudioExceptionLabel(filename) {
            const exception = songAudioExceptions[filename];
            if (!exception) return '';
            const labels = [];
            const hasDetailedExceptions = Array.isArray(exception.audio_exceptions) && exception.audio_exceptions.length > 0;
            const modeNames = { guide: '導唱 c2', instrumental: '伴奏 c4' };
            const metricNames = { loudness: 'LUFS', true_peak: 'TP', loudness_range: 'LRA' };
            for (const item of (hasDetailedExceptions ? exception.audio_exceptions : [])) {
                const measured = Number(item.measured);
                if (!Number.isFinite(measured) || !modeNames[item.mode] || !metricNames[item.metric]) continue;
                const value = item.metric === 'true_peak'
                    ? `${measured >= 0 ? '+' : ''}${measured.toFixed(1)} dBTP`
                    : `${measured.toFixed(1)} ${item.unit}`;
                labels.push(`${modeNames[item.mode]} ${metricNames[item.metric]} ${value}（標準 ${item.standard}）`);
            }
            const measuredPeak = Number(exception.c4_true_peak_dbtp);
            const measuredLra = Number(exception.c4_lra_lu);
            if (!hasDetailedExceptions && exception.c4_true_peak_dbtp != null && Number.isFinite(measuredPeak)) {
                labels.push(`c4 TP ${measuredPeak >= 0 ? '+' : ''}${measuredPeak.toFixed(1)} dBTP`);
            }
            if (!hasDetailedExceptions && exception.c4_lra_lu != null && Number.isFinite(measuredLra)) {
                labels.push(`c4 LRA ${measuredLra.toFixed(1)} LU`);
            }
            if (exception.metadata_error) labels.push('特殊歌曲標記無效');
            return labels.length ? `<span class="song-audio-exception">⚠ ${labels.join(' · ')}</span>` : '';
        }

        function filter() {
            const key = document.getElementById('search').value.toLowerCase();
            const selectedLength = document.getElementById('song-length-filter').value;
            const selectedSinger = document.getElementById('singer-filter').value;
            const selectedLanguage = document.getElementById('language-filter').value;
            const selectedAffiliations = getSelectedAffiliations();
            const list = document.getElementById('list');
            const matchingSongs = sortedSongMetadata.filter(({ filename, metadata }) => {
                return filename.toLowerCase().includes(key)
                    && (!selectedLength || metadata.length === selectedLength)
                    && (!selectedSinger || metadata.singer === selectedSinger)
                    && (!selectedLanguage || metadata.language === selectedLanguage)
                    && (!selectedAffiliations.size || selectedAffiliations.has(metadata.affiliation));
            });
            const rows = sortSongEntries(matchingSongs).map(({ filename: s }) => {
                const subtitleButton = subtitleSongs.has(s) ? '<button class="song-btn" type="button" disabled title="此歌有字幕">字幕</button>' : '';
                const isPending = pendingSongs.has(s);
                const queueIndex = currentPlaylist.indexOf(s);
                const isQueued = queueIndex !== -1;
                const isPlaying = queueIndex === 0;
                const statusLabel = isPlaying ? '<span class="song-status">播放中</span>' : isQueued ? '<span class="song-status">已排隊</span>' : '';
                const exceptionLabel = songAudioExceptionLabel(s);
                const playButton = isPending
                    ? '<button class="song-btn added" disabled>已加入</button>'
                    : `<button class="song-btn" onclick="play(this, '${s}')">播歌</button>`;
                return `
                    <li class="song-row ${isPending || isQueued ? 'song-added' : ''} ${isPlaying ? 'song-playing' : ''}" onclick="playSongFromRow(this, '${s}', event)">
                        <span class="song-main"><span class="song-name">${statusLabel}${s}</span>${exceptionLabel}</span>
                        <span>${subtitleButton}${playButton}</span>
                    </li>`;
            });
            list.innerHTML = rows.join('');
        }

        /**
         * Sends a song to the queue and keeps visible feedback during the request window.
         * @param {HTMLButtonElement} button Clicked play button.
         * @param {string} filename Song filename to queue.
         */
        function play(button, filename) {
            if (pendingSongs.has(filename)) return;
            pendingSongs.add(filename);
            button.disabled = true;
            button.classList.add('added');
            button.textContent = '已加入';
            button.closest('li').classList.add('song-added');
            socket.emit('add_to_queue', { filename: filename });
            setTimeout(() => {
                pendingSongs.delete(filename);
                filter();
            }, 1500);
        }

        /**
         * Queues a song when its song row is selected.
         * @param {HTMLLIElement} rowElement Selected song row.
         * @param {string} filename Song filename to queue.
         * @param {MouseEvent} event Click event used to preserve nested button actions.
         */
        function playSongFromRow(rowElement, filename, event) {
            if (event.target.closest('button')) return;
            const playButton = rowElement.querySelector('button[onclick^="play("]');
            if (playButton) play(playButton, filename);
        }

        /** Download a selected cloud song on the KTV server, then use the shared queue event. */
        async function queueDriveSong(button, song) {
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = song.downloaded ? '加入中...' : '下載中...';
            try {
                let filename = song.filename;
                if (!song.downloaded) {
                    const response = await fetch('/api/drive/library-songs/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ file_id: song.id })
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
                    filename = payload.filename;
                    song.downloaded = true;
                    song.filename = filename;
                    // 下載完成後同步刷新一般歌曲清單，讓其他遙控器立即看到本機可播放歌曲。
                    loadList();
                    loadSubtitleList();
                }
                if (!filename) throw new Error('伺服器未回傳可播放的本機歌曲識別。');
                pendingSongs.add(filename);
                socket.emit('add_to_queue', { filename });
                button.textContent = '已加入';
                window.setTimeout(() => {
                    pendingSongs.delete(filename);
                    button.disabled = false;
                    button.textContent = '點歌';
                }, 1500);
            } catch (error) {
                button.disabled = false;
                button.textContent = song.downloaded ? '點歌' : '下載並點歌';
                document.getElementById('drive-library-status').textContent = error.message;
            }
        }

        async function connectRoomGoogleDrive() {
            const status = document.getElementById('drive-library-status');
            try {
                const accountResponse = await fetch('/api/drive/library-status', { cache: 'no-store' });
                const account = await accountResponse.json().catch(() => ({}));
                if (!accountResponse.ok) throw new Error(account.error || `HTTP ${accountResponse.status}`);
                if (!account.configured) throw new Error('Render 尚未設定 Google OAuth／Picker 資料，請先完成部署設定。');
                if (account.linked) {
                    await selectRoomDriveFolder();
                    return;
                }
                const response = await fetch('/api/drive/google/start', { method: 'POST', headers: { 'Accept': 'application/json' } });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok || !payload.authorization_url) throw new Error(payload.error || `HTTP ${response.status}`);
                // OAuth 必須在最上層頁面完成；完成後返回一體機，再由遙控器 iframe 自動開啟資料夾選擇器。
                window.top.location.assign(payload.authorization_url);
            } catch (error) {
                status.textContent = error.message;
            }
        }

        async function selectRoomDriveFolder() {
            const status = document.getElementById('drive-library-status');
            // Google Picker is rendered below the browser's native dialog top layer, so close
            // the Drive library dialog before opening Picker.
            closeDriveLibrary();
            try {
                const tokenResponse = await fetch('/api/drive/google/picker-token', { cache: 'no-store' });
                const tokenData = await tokenResponse.json().catch(() => ({}));
                if (!tokenResponse.ok) throw new Error(tokenData.error || `HTTP ${tokenResponse.status}`);
                for (let retry = 0; !window.gapi && retry < 30; retry += 1) {
                    await new Promise((resolve) => window.setTimeout(resolve, 200));
                }
                if (!window.gapi) throw new Error('Google Picker 程式尚未載入，請重新開啟歌庫。');
                await new Promise((resolve) => window.gapi.load('picker', resolve));
                const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS);
                view.setIncludeFolders(true);
                view.setSelectFolderEnabled(true);
                const picker = new google.picker.PickerBuilder()
                    .setAppId(tokenData.project_number)
                    .setDeveloperKey(tokenData.api_key)
                    .setOAuthToken(tokenData.access_token)
                    .setOrigin(window.location.origin)
                    .setTitle('選擇包含 MP4 歌曲與歌詞的資料夾')
                    .addView(view)
                    .setCallback(async (result) => {
                        if (result.action !== google.picker.Action.PICKED) {
                            if (result.action === google.picker.Action.CANCEL) {
                                openDriveLibraryPanel();
                                status.textContent = '已取消資料夾選擇。';
                            }
                            return;
                        }
                        try {
                            const docs = result[google.picker.Response.DOCUMENTS] || [];
                            const folder = docs[0];
                            if (!folder || !folder.id) throw new Error('沒有選取資料夾。');
                            const saveResponse = await fetch('/api/drive/library-folder', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                                body: JSON.stringify({ folder_id: folder.id })
                            });
                            const saved = await saveResponse.json().catch(() => ({}));
                            if (!saveResponse.ok) throw new Error(saved.error || `HTTP ${saveResponse.status}`);
                            openDriveLibraryPanel();
                            status.textContent = `已設定資料夾「${saved.folder_name || folder.name || ''}」，找到 ${saved.song_count || 0} 首 MP4 歌曲。`;
                            await loadDriveLibrary();
                        } catch (error) {
                            openDriveLibraryPanel();
                            status.textContent = error.message;
                        }
                    })
                    .build();
                picker.setVisible(true);
            } catch (error) {
                openDriveLibraryPanel();
                status.textContent = error.message;
            }
        }

        /** Load this browser user's selected Drive folder without exposing OAuth credentials. */
        async function loadDriveLibrary() {
            const status = document.getElementById('drive-library-status');
            const list = document.getElementById('drive-library-list');
            try {
                if (cloudMode) {
                    const accountResponse = await fetch('/api/drive/library-status', { cache: 'no-store' });
                    const account = await accountResponse.json().catch(() => ({}));
                    if (!accountResponse.ok) throw new Error(account.error || `HTTP ${accountResponse.status}`);
                    if (!account.configured) {
                        status.textContent = 'Render 尚未設定 Google OAuth／Picker 資料，請先完成部署設定。';
                        return;
                    }
                    if (!account.linked) {
                        status.textContent = '此使用者尚未連結 Google Drive，請按上方按鈕登入自己的帳號。';
                        return;
                    }
                    if (!account.folder_id) {
                        status.textContent = '你的 Google Drive 已連結，請按上方按鈕選擇歌庫資料夾。';
                        return;
                    }
                }
                const response = await fetch('/api/drive/library-songs', { cache: 'no-store' });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    // 面板只有在使用者主動展開後才顯示設定狀態，避免佔用遙控器畫面。
                    status.textContent = payload.error || `HTTP ${response.status}`;
                    return;
                }
                driveLibrarySongs = Array.isArray(payload.songs) ? payload.songs : [];
                status.textContent = cloudMode
                    ? `資料夾「${payload.folder && payload.folder.name || ''}」：${driveLibrarySongs.length} 首 MP4 歌曲（含配對歌詞）`
                    : `資料夾「${payload.folder && payload.folder.name || ''}」：${driveLibrarySongs.length} 首 MP4`;
                renderDriveLibrarySongs();
            } catch (error) {
                status.textContent = '無法讀取 Google Drive 歌庫：' + error.message;
            }
        }

        /** 切換雲端歌庫面板；首次展開時才向伺服器讀取歌曲清單。 */
        function renderDriveLibrarySongs() {
            const list = document.getElementById('drive-library-list');
            const key = document.getElementById('drive-library-search').value.trim().toLowerCase();
            const songs = driveLibrarySongs.filter((song) => {
                const name = String(song.name || song.id || '').toLowerCase();
                return !key || name.includes(key);
            });
            list.replaceChildren();
            for (const song of songs) {
                const row = document.createElement('li');
                row.className = 'drive-library-row';
                const label = document.createElement('span');
                label.textContent = (song.name || song.id) + (song.has_lyrics ? '　📝' : '');
                if (song.has_lyrics) label.title = '找到同名歌詞檔';
                const button = document.createElement('button');
                button.className = 'btn';
                button.type = 'button';
                button.textContent = song.downloaded ? '已下載' : '下載並點歌';
                button.addEventListener('click', () => queueDriveSong(button, song));
                row.append(label, button);
                list.appendChild(row);
            }
        }

        function toggleDriveLibrary() {
            const panel = document.getElementById('drive-library-panel');
            if (panel.open) {
                closeDriveLibrary();
                return;
            }
            openDriveLibraryPanel();
            loadDriveLibrary();
        }

        function openDriveLibraryPanel() {
            const panel = document.getElementById('drive-library-panel');
            const toggle = document.getElementById('drive-library-toggle');
            if (!panel.open) panel.showModal();
            toggle.setAttribute('aria-expanded', 'true');
            toggle.setAttribute('aria-label', '關閉 Google Drive 歌庫');
        }

        function closeDriveLibrary() {
            const panel = document.getElementById('drive-library-panel');
            const toggle = document.getElementById('drive-library-toggle');
            if (panel.open) panel.close();
            toggle.setAttribute('aria-expanded', 'false');
        }

        function cmd(action) { socket.emit('control', action); }
        function track(mode) { socket.emit('change_track', mode); }

        /** 向目前播放歌曲送出 10 秒跳轉，不修改畫面延遲校正值。 */
        function seekSong(seconds) {
            if (seekCorrectionEnabled || (seconds !== -10 && seconds !== 10)) return;
            socket.emit('seek_song', { seconds });
        }

        /**
         * Inserts the currently playing song as the next queued song.
         */
        function replayCurrentSong() { socket.emit('replay_current_song'); }

        function loadList() {
            fetch('/api/list').then(r => r.json()).then((songs) => {
                setSongList(songs);
                renderCategoryFilters();
                filter();
            });
        }

        // Keep the modal outside the tab panels so it also works from the control tab.
        document.body.appendChild(document.getElementById('drive-library-panel'));
        loadList();
        document.getElementById('drive-library-toggle').addEventListener('click', toggleDriveLibrary);
        document.getElementById('drive-library-search').addEventListener('input', renderDriveLibrarySongs);
        document.getElementById('drive-google-connect').addEventListener('click', connectRoomGoogleDrive);
        document.getElementById('drive-library-panel').addEventListener('close', () => {
            document.getElementById('drive-library-toggle').setAttribute('aria-expanded', 'false');
        });
        const driveReturn = new URLSearchParams(window.location.search).get('drive');
        if (cloudMode && driveReturn === 'connected') {
            window.history.replaceState(null, '', window.location.pathname);
            document.getElementById('drive-library-status').textContent = 'Google 帳號已連結，請選擇歌曲資料夾。';
            window.setTimeout(selectRoomDriveFolder, 0);
        } else if (cloudMode && driveReturn === 'cancelled') {
            window.history.replaceState(null, '', window.location.pathname);
            openDriveLibraryPanel();
            document.getElementById('drive-library-status').textContent = '已取消 Google Drive 授權。';
        }
        loadSubtitleList();
        // 監聽後台更新完畢事件，自動重整歌單
        socket.on('refresh_list', () => { loadList(); loadSubtitleList(); });

        // --- 音效與升降 KEY 控制 ---
        function updateEffect() {
            const vol = parseFloat(document.getElementById('vol').value);
            document.getElementById('vol-val').innerText = Math.round(vol * 100) + "%";
            socket.emit('control_effect', { volume: vol });
        }

        function changeKey(step) {
            if (step === 0) {
                currentKey = 0;
            } else {
                currentKey += step;
            }

            // 限制最多升降 12 個半音 (一個八度)
            if (currentKey > 12) currentKey = 12;
            if (currentKey < -12) currentKey = -12;

            socket.emit('control_effect', { pitch: currentKey });
        }

        /**
         * Requests a half-second playback position adjustment for all players.
         * @param {-0.5|-0.1|0|0.1|0.5} seconds Signed seek adjustment in seconds.
         */
        function seekVideo(seconds) {
            if (![-0.5, -0.1, 0, 0.1, 0.5].includes(seconds)) return;
            // 伺服器端已經驗證秒數合法，且本次使用情境下功能開關由伺服器主控。
            // 若在這裡再擋一次 local seekCorrectionEnabled，會讓按鈕點擊完全沒有反應，
            // 導致遠端 UI 看起來可點但實際不發送任何 seek_video 事件。
            socket.emit('seek_video', { seconds });
        }

        /**
         * Updates the server-controlled video progress correction state.
         * @param {boolean} enabled Whether video-only progress correction is enabled.
         */
        function updateSeekCorrectionState(enabled) {
            seekCorrectionEnabled = Boolean(enabled);
            // 伺服器未開啟畫面延遲功能時，遙控器不顯示無法使用的控制區。
            document.getElementById('seek-correction-control').style.display = seekCorrectionEnabled ? 'block' : 'none';
            document.querySelectorAll('.seek-control').forEach((button) => {
                button.disabled = !seekCorrectionEnabled;
                button.style.opacity = seekCorrectionEnabled ? '1' : '0.45';
            });
            document.querySelectorAll('.song-seek-control').forEach((button) => {
                button.disabled = seekCorrectionEnabled;
                button.style.display = seekCorrectionEnabled ? 'none' : '';
                button.style.opacity = seekCorrectionEnabled ? '0.45' : '1';
            });
            document.getElementById('seek-val').innerText = seekCorrectionEnabled
                ? (seekOffset === 0 ? '0 秒' : `${seekOffset.toFixed(1)} 秒`)
                : '伺服器已關閉';
        }

        /**
         * Displays the accumulated video-only offset from the original position.
         * @param {number} offset Signed accumulated offset in seconds.
         */
        function updateSeekOffset(offset) {
            seekOffset = Math.round(offset * 10) / 10;
            document.getElementById('seek-val').innerText = seekOffset === 0
                ? '同步'
                : seekOffset > 0
                    ? `延遲 ${seekOffset.toFixed(1)} 秒`
                    : `提前 ${Math.abs(seekOffset).toFixed(1)} 秒`;
        }

        socket.on('seek_video', (data) => updateSeekOffset(Number(data.offset) || 0));
        socket.on('seek_correction', (data) => updateSeekCorrectionState(Boolean(data && data.enabled)));

        // 接收伺服器廣播，同步更新介面狀態 (若有其他手機也在操作)
        socket.on('apply_effect', (data) => {
            if (data.pitch !== undefined) {
                currentKey = data.pitch;
                document.getElementById('key-val').innerText = currentKey === 0 ? "原 KEY (0)" : (currentKey > 0 ? "+" + currentKey : currentKey);
            }
            if (data.volume !== undefined) {
                document.getElementById('vol').value = data.volume;
                document.getElementById('vol-val').innerText = Math.round(data.volume * 100) + "%";
            }
        });
    </script>
</body>
