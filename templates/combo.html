                video.currentTime = Math.max(0, Math.min(video.duration, targetTime - getDualMediaOffsetSeconds()));
            } else {
                video.currentTime = targetTime;
            }
        });

        socket.on('command', (cmd) => {
            if (cmd === 'pause') {
                if (isDualMediaSeekCorrectionActive()) {
                    if (video.paused) Promise.all([video.play(), audioTrack.play()]);
                    else { video.pause(); audioTrack.pause(); }
                } else {
                    if (video.paused) video.play();
                    else video.pause();
                }
            }
        });

        function requestAudioMode(mode, requestId = null) {
            const safeMode = ['original', 'guide', 'instrumental'].includes(mode) ? mode : 'original';
            const token = requestId === null ? ++audioModeRequestId : requestId;
            currentMode = safeMode;
            if (requestId === null) {
                audioModeRequestId = token;
            }
            if (!isAudioSetup || !audioGains || !audioCtx) return;
            if (token !== audioModeRequestId) return;
            const now = audioCtx.currentTime;
            const transitionEnd = now + 0.02;
            const channels = isSixChannelAudio
                ? (safeMode === 'guide' ? (guideVocalControlSupported ? [2, 4] : [2]) : safeMode === 'instrumental' ? [4] : [0, 1])
                : (safeMode === 'instrumental' ? [1] : safeMode === 'guide' ? [0, 1] : [0]);
            audioGains.forEach((gain) => {
                const channelIndex = audioGains.indexOf(gain);
                gain.gain.cancelScheduledValues(now);
                gain.gain.setValueAtTime(gain.gain.value, now);
                const channelGain = isSixChannelAudio && channels.includes(channelIndex)
                    ? (guideVocalControlSupported && safeMode === 'guide' && channelIndex === 2 ? currentVocalLevel / 100 : 1)
                    : 0;
                gain.gain.linearRampToValueAtTime(channelGain, transitionEnd);
            });
            legacyStereoGains.forEach((gain, channelIndex) => {
                gain.gain.setTargetAtTime(!isSixChannelAudio && channels.includes(channelIndex) ? 1 : 0, transitionEnd, 0.01);
            });
            if (guideMixGain) {
                const guideGain = guideVocalControlSupported && safeMode === 'guide' ? 1 : 0;
                guideMixGain.gain.cancelScheduledValues(now);
                guideMixGain.gain.setValueAtTime(guideMixGain.gain.value, now);
                guideMixGain.gain.linearRampToValueAtTime(guideGain, transitionEnd);
            }
            if (instrumentalModeGain) {
                instrumentalModeGain.gain.setTargetAtTime(
                    isSixChannelAudio && safeMode === 'instrumental' ? 1 : 0,
                    transitionEnd,
                    0.01,
                );
            }
            if (legacyGuideGain) {
                legacyGuideGain.gain.setTargetAtTime(
                    isSixChannelAudio && !guideVocalControlSupported && safeMode === 'guide' ? 1 : 0,
                    transitionEnd,
                    0.01,
                );
            }
            currentActiveChannels = channels.map((channel) => `c${channel}`).join(',');
            setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            overlay.innerText = safeMode === 'guide' ? "🎵 模式：導唱" : safeMode === 'instrumental' ? "🚫 模式：伴奏" : "🎤 模式：原聲";
            renderGuideVocalControl();
        }

        /** Show the vocal slider only for a marked vocal-stem song in guide mode. */
        function renderGuideVocalControl() {
            const control = document.getElementById('guide-vocal-control');
            if (!control) return;
            document.getElementById('guide-vocal-level-label').textContent = `${currentVocalLevel}%`;
            document.getElementById('guide-vocal-level').value = String(currentVocalLevel);
            control.style.display = currentMode === 'guide' && guideVocalControlSupported ? 'block' : 'none';
        }

        /** Apply vocal-only gain; rebroadcast only direct slider input to avoid event loops. */
        function applyGuideVocalLevel(value, broadcast) {
            currentVocalLevel = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
            if (guideVocalControlSupported && currentMode === 'guide' && audioGains && audioCtx) {
                const now = audioCtx.currentTime;
                audioGains[2].gain.cancelScheduledValues(now);
                audioGains[2].gain.setTargetAtTime(currentVocalLevel / 100, now, 0.03);
            }
            renderGuideVocalControl();
            if (broadcast) socket.emit('change_vocal_level', { level: currentVocalLevel });
        }

        /** Apply a user slider change and synchronize its value to other clients. */
        function updateGuideVocalLevel(value) { applyGuideVocalLevel(value, true); }

        socket.on('set_audio', (data) => {
            const mode = typeof data === 'string' ? data : data.mode;
            const requestId = Number.isFinite(Number(data && data.request_id)) ? Number(data.request_id) : null;
            const safeMode = ['original', 'guide', 'instrumental'].includes(mode) ? mode : 'original';
            if (requestId !== null) {
                audioModeRequestId = Math.max(audioModeRequestId, requestId);
            }
            currentMode = safeMode;
            if (data && typeof data === 'object') {
                if (typeof data.guide_vocal_control === 'boolean') guideVocalControlSupported = data.guide_vocal_control;
                if (Number.isFinite(Number(data.vocal_level))) currentVocalLevel = Number(data.vocal_level);
            }
            if (data && typeof data === 'object' && Number.isFinite(Number(data.audio_loudness_lufs))) {
                currentLoudness = Number(data.audio_loudness_lufs);
                setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            }
            requestAudioMode(safeMode, requestId !== null ? requestId : ++audioModeRequestId);
        });

        socket.on('set_vocal_level', (data) => {
            if (!Number.isFinite(Number(data && data.level))) return;
            applyGuideVocalLevel(data.level, false);
        });

        /**
         * Selects one stereo pair from a six-channel KTV stream or the legacy L/R stream.
         * @param {string} mode Playback mode: original, guide, or instrumental.
         */
        function setAudioMode(mode) {
            requestAudioMode(mode, audioModeRequestId);
        }

        // --- 遙控器邏輯 ---
        let allSongs = [];
        let sortedSongMetadata = [];
        let songPlayCounts = {};
        let songSortModeIndex = 0;
        let songAudioExceptions = {};
        let subtitleSongs = new Set();
        let currentPlayingFilename = '';
        let currentSubtitleStyleMode = 0;
        let currentSubtitleMode = 0;
        const subtitleDisplayLabels = ['隱藏', '一般', '單行', '雙行', '雙行漸變'];
        let renderedSubtitleSlotIndex = -1;
        let renderedSubtitleActiveLineIndex = 0;
        const subtitleStyleLabels = ['背景', '陰影'];
        const pendingSongs = new Set();
        /**
         * Loads the songs that have a matching subtitle file.
         */
        function loadSubtitleList() {
            fetch('/api/subtitles').then(response => response.json()).then(songs => {
                subtitleSongs = new Set(songs);
                filter();
                renderCurrentSongControl();
            });
        }

        /**
         * Parses the fixed song filename format into classification fields.
         * @param {string} filename Song filename in song-singer-language-id.mp4 format.
         * @returns {Object} Song metadata with title, singer, language, and length fields.
         */
        function parseSongMetadata(filename) {
            const name = filename.replace(/\.mp4$/i, '');
            const parts = name.split('-');
            if (parts.length < 2) return { title: name, singer: '未辨識', language: '未辨識', length: '未辨識', code: null, affiliation: '未標記' };
            const title = parts[0];
            const code = /^\d+$/.test(parts[3] || '') ? Number(parts[3]) : null;
            const affiliation = parts.length > 4 ? parts.slice(4).join('-') : '未標記';
            return {
                title,
                singer: parts[1] || '未辨識',
                language: parts[2] || '未辨識',
                length: String(Array.from(title).length),
                code,
                affiliation,
            };
        }

        /**
         * Extracts the final numeric song code used for reverse sorting.
         * @param {string} filename Song filename.
         * @returns {number|null} Numeric song code, or null when unavailable.
         */
        function getSongCode(filename) {
            return parseSongMetadata(filename).code;
        }

        /**
         * Sorts songs with unknown codes first, then numeric codes descending.
         * @param {string} firstFilename First song filename.
         * @param {string} secondFilename Second song filename.
         * @returns {number} Sort comparison result.
         */
        function compareSongCodeDescending(firstFilename, secondFilename) {
            const firstCode = getSongCode(firstFilename);
            const secondCode = getSongCode(secondFilename);
            if (firstCode === null && secondCode === null) return firstFilename.localeCompare(secondFilename, 'zh-Hant');
            if (firstCode === null) return -1;
            if (secondCode === null) return 1;
            return secondCode - firstCode || firstFilename.localeCompare(secondFilename, 'zh-Hant');
        }

        /** Returns the language filter required by the active language sort mode. */
        function getSongSortLanguage() {
            return songSortModeIndex === 3 ? '國' : songSortModeIndex === 4 ? '台' : '';
        }

        /** Keeps the visible language selector aligned with the active sort mode. */
        function setSongSortLanguage(language) {
            const languageFilter = document.getElementById('language-filter');
            if (language && ![...languageFilter.options].some((option) => option.value === language)) {
                const option = document.createElement('option');
                option.value = language;
                option.textContent = language;
                languageFilter.appendChild(option);
            }
            languageFilter.value = language;
        }

        /** Sorts visible songs by playback starts or by the existing reverse song-code rule. */
        function sortSongEntries(songs) {
            return [...songs].sort((firstSong, secondSong) => {
                if (songSortModeIndex === 0) return compareSongCodeDescending(firstSong.filename, secondSong.filename);
                const firstPlayCount = Number(songPlayCounts[firstSong.filename]) || 0;
                const secondPlayCount = Number(songPlayCounts[secondSong.filename]) || 0;
                const playCountDifference = songSortModeIndex === 2
                    ? firstPlayCount - secondPlayCount
                    : secondPlayCount - firstPlayCount;
                return playCountDifference || compareSongCodeDescending(firstSong.filename, secondSong.filename);
            });
        }

        /** Cycles five sort modes and applies the language selector when needed. */
        function cycleSongSortMode() {
            const previousLanguage = getSongSortLanguage();
            songSortModeIndex = (songSortModeIndex + 1) % 5;
            if (previousLanguage && document.getElementById('language-filter').value === previousLanguage) {
                setSongSortLanguage('');
            }
            const nextLanguage = getSongSortLanguage();
            if (nextLanguage) setSongSortLanguage(nextLanguage);
            document.getElementById('song-sort-mode').textContent = ['新歌', '熱門', '冷門', '國語', '台語'][songSortModeIndex];
            renderCategoryFilters();
            filter();
        }

        function setSongList(songs) {
            allSongs = Array.isArray(songs) ? songs : [];
            sortedSongMetadata = allSongs.map((filename) => ({ filename, metadata: parseSongMetadata(filename) }))
                .sort((firstSong, secondSong) => compareSongCodeDescending(firstSong.filename, secondSong.filename));
        }

        /** Rebuilds each category from search results matching every other selected category. */
        function renderCategoryFilters() {
            const lengthFilter = document.getElementById('song-length-filter');
            const singerFilter = document.getElementById('singer-filter');
            const languageFilter = document.getElementById('language-filter');
            const affiliationFilter = document.getElementById('affiliation-filter');
            const affiliationOptions = document.getElementById('affiliation-filter-options');
            const affiliationSummary = affiliationFilter.querySelector('summary');
            const selectedAffiliations = getSelectedAffiliations();
            const filters = [lengthFilter, singerFilter, languageFilter];
            const previous = filters.map((filterElement) => filterElement.value);
            const fields = ['length', 'singer', 'language', 'affiliation'];
            const query = document.getElementById('search').value.toLowerCase();
            const matchingSongs = sortedSongMetadata.filter(({ filename }) => filename.toLowerCase().includes(query));
            const valuesForFilter = (filterIndex) => [...new Set(matchingSongs
                .filter(({ metadata }) => previous.every((value, index) => index === filterIndex || !value || metadata[fields[index]] === value)
                    && (filterIndex === 3 || !selectedAffiliations.size || selectedAffiliations.has(metadata.affiliation)))
                .map(({ metadata }) => metadata[fields[filterIndex]]))];
            const lengths = valuesForFilter(0).sort((a, b) => Number(a) - Number(b));
            const singers = valuesForFilter(1).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const languages = valuesForFilter(2);
            const sortLanguage = getSongSortLanguage();
            if (sortLanguage && !languages.includes(sortLanguage)) languages.push(sortLanguage);
            languages.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const affiliations = valuesForFilter(3).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const availableAffiliations = new Set(affiliations);
            const validSelections = new Set([...selectedAffiliations].filter(value => availableAffiliations.has(value)));
            lengthFilter.innerHTML = '<option value="">歌曲字數：全部</option>' + lengths.map(value => `<option value="${value}">${value === '未辨識' ? value : `${value} 字`}</option>`).join('');
            singerFilter.innerHTML = '<option value="">主唱者：全部</option>' + singers.map(value => `<option value="${value}">${value}</option>`).join('');
            languageFilter.innerHTML = '<option value="">語言：全部</option>' + languages.map(value => `<option value="${value}">${value}</option>`).join('');
            filters.forEach((filterElement, index) => { filterElement.value = previous[index]; });
            affiliationOptions.replaceChildren();
            affiliations.forEach((value) => {
                const label = document.createElement('label');
                label.className = 'category-multi-option';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = value;
                checkbox.checked = validSelections.has(value);
                checkbox.addEventListener('change', handleCategoryChange);
                const text = document.createElement('span');
                text.textContent = value;
                label.append(checkbox, text);
                affiliationOptions.appendChild(label);
            });
            affiliationSummary.textContent = validSelections.size ? `歸屬：${validSelections.size} 項` : '歸屬：全部';
            if (filters.some((filterElement, index) => filterElement.value !== previous[index]) || validSelections.size !== selectedAffiliations.size) {
                renderCategoryFilters();
            }
        }

        /** 取得目前勾選的歌曲歸屬分類。 */
        function getSelectedAffiliations() {
            return new Set([...document.querySelectorAll('#affiliation-filter-options input:checked')].map(input => input.value));
        }

        /** 清除已選歸屬，供搜尋與清除篩選時重設。 */
        function clearSelectedAffiliations() {
            document.querySelectorAll('#affiliation-filter-options input').forEach(input => { input.checked = false; });
        }

        /**
         * Renders the subtitle control for the song currently being played.
         */
        function renderCurrentSongControl() {
            const control = document.getElementById('current-song-control');
            const button = document.getElementById('current-subtitle-button');
            const hasSong = Boolean(currentPlayingFilename);
            const hasSubtitle = currentSongHasSubtitle || subtitleSongs.has(currentPlayingFilename);
            const shouldShow = hasSong && hasSubtitle;
            control.style.display = shouldShow ? 'block' : 'none';
            if (!hasSong) return;
            const subtitleLabel = subtitleDisplayLabels[currentSubtitleMode] || subtitleDisplayLabels[0];
            button.textContent = `字幕：${subtitleLabel}`;
            renderSubtitleStyleButton();
        }

        /** Show the active background or shadow mode and cycle between them. */
        function renderSubtitleStyleButton() {
            const button = document.getElementById('subtitle-style-button');
            const label = subtitleStyleLabels[currentSubtitleStyleMode] || subtitleStyleLabels[0];
            button.textContent = `${label}`;
            button.setAttribute('aria-label', `字幕：${label}，按一下切換`);
        }

        function cycleSubtitleStyleMode() {
            socket.emit('set_subtitle_style_mode', { mode: (currentSubtitleStyleMode + 1) % subtitleStyleLabels.length });
        }

        /**
         * Updates the fixed playback subtitle control from the server state.
         * @param {Object} data Current playback state with filename and visible fields.
         */
        function updateCurrentSong(data) {
            currentPlayingFilename = data.filename || '';
            currentSongHasSubtitle = typeof data.has_subtitle === 'boolean'
                ? data.has_subtitle
                : subtitleSongs.has(currentPlayingFilename);
            if (!currentPlayingFilename) {
                currentQueueHistory = [];
                renderQueue([]);
            }
            currentSubtitleMode = currentSongHasSubtitle ? Math.max(0, Math.min(4, Number(data.subtitle_mode) || 0)) : 0;
            currentSubtitleFontSize = Number(data.font_size) || 120;
            applySubtitleFontSize(currentSubtitleFontSize);
            renderSubtitleFontSizeControl();
            renderCurrentSongControl();
        }

        /**
         * Toggles subtitles for the song currently being played.
         */
        function toggleCurrentSubtitle() {
            if (currentPlayingFilename && (currentSongHasSubtitle || subtitleSongs.has(currentPlayingFilename))) {
                const nextMode = (currentSubtitleMode + 1) % subtitleDisplayLabels.length;
                socket.emit('set_subtitle_mode', { filename: currentPlayingFilename, mode: nextMode });
            }
        }

        /**
         * Adjusts the shared subtitle font size by a controlled step and clamps it to a safe range.
         * @param {number} step Amount to change the subtitle scale in percentage points.
         */
        function changeSubtitleFontSize(step) {
            const nextSize = Math.min(200, Math.max(80, currentSubtitleFontSize + step));
            if (nextSize === currentSubtitleFontSize) return;
            currentSubtitleFontSize = nextSize;
            applySubtitleFontSize(nextSize);
            renderSubtitleFontSizeControl();
            socket.emit('set_subtitle_font_size', { font_size: nextSize });
        }

        /**
         * Updates the all-in-one subtitle size label and button states.
         */
        function renderSubtitleFontSizeControl() {
            const subtitleSizeLabel = document.getElementById('subtitle-size-label');
            const increaseButton = document.getElementById('subtitle-size-increase');
            const decreaseButton = document.getElementById('subtitle-size-decrease');
            subtitleSizeLabel.textContent = `${currentSubtitleFontSize}%`;
            increaseButton.disabled = currentSubtitleFontSize >= 200;
            decreaseButton.disabled = currentSubtitleFontSize <= 80;
            increaseButton.style.opacity = increaseButton.disabled ? '0.55' : '1';
            decreaseButton.style.opacity = decreaseButton.disabled ? '0.55' : '1';
        }

        socket.on('current_song', updateCurrentSong);

        socket.on('subtitle_style_mode', (data) => {
            const mode = Number(data && data.mode);
            if (!Number.isInteger(mode) || mode < 0 || mode >= subtitleStyleLabels.length) return;
            currentSubtitleStyleMode = mode;
            renderSubtitleStyleButton();
        });

        socket.on('subtitle_state', (data) => {
            if (data.filename === currentPlayingFilename) {
                currentSongHasSubtitle = typeof data.has_subtitle === 'boolean'
                    ? data.has_subtitle
                    : subtitleSongs.has(currentPlayingFilename);
                currentSubtitleMode = currentSongHasSubtitle ? Math.max(0, Math.min(4, Number(data.subtitle_mode) || 0)) : 0;
                if (data.font_size !== undefined) {
                    currentSubtitleFontSize = Number(data.font_size) || currentSubtitleFontSize;
                    applySubtitleFontSize(currentSubtitleFontSize);
                }
                renderSubtitleFontSizeControl();
                renderCurrentSongControl();
            }
        });

        function updateEffect() {
            const vol = parseFloat(document.getElementById('vol').value);
            document.getElementById('vol-val').innerText = Math.round(vol * 100) + "%";
            socket.emit('control_effect', { volume: vol });
        }

        socket.on('update_list', (songs) => { setSongList(songs); renderCategoryFilters(); filter(); });
        socket.on('song_play_counts', (counts) => {
            songPlayCounts = counts && typeof counts === 'object' ? counts : {};
            filter();
        });

        function renderQueue(playlist) {
            currentQueueHistory = Array.isArray(playlist) ? playlist : [];
            renderEngineStatus();
            if(currentQueueHistory.length > 1) {
                nextInfo.innerText = "下一首：" + currentQueueHistory[1].replace('.mp4', '');
                nextInfo.style.display = 'block';
            } else {
                nextInfo.style.display = 'none';
            }

            const qList = document.getElementById('queue-list');
            qList.innerHTML = "";
            if(currentQueueHistory.length === 0) {
                qList.innerHTML = "<li>(無)</li>";
            } else {
                currentQueueHistory.forEach((s, index) => {
                    const name = index === 0 ? `🎵 播放中：${s.replace('.mp4', '')}` : s.replace('.mp4', '');
                    const item = document.createElement('li');
                    if (index === 0) item.style.cssText = 'color:#4CAF50; font-weight:bold;';
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = name;
                    if (hasMeaningfulSongNote(songNotes[s])) {
                        const noteIndicator = document.createElement('span');
                        noteIndicator.className = 'note-indicator';
                        noteIndicator.textContent = '📝';
                        nameSpan.appendChild(noteIndicator);
                    }
                    item.appendChild(nameSpan);
                    const noteButton = document.createElement('button');
                    noteButton.className = 'song-btn';
                    noteButton.textContent = '備註';
                    noteButton.addEventListener('click', () => openSongNote(s));
                    item.appendChild(noteButton);
                    if (index !== 0) {
                        const removeButton = document.createElement('button');
                        removeButton.className = 'song-btn';
                        removeButton.textContent = '刪除';
                        removeButton.addEventListener('click', () => removeQueuedSong(index));
                        item.appendChild(removeButton);
                    }
                    qList.appendChild(item);
                });
            }
            filter();
        }

        // 只有備註真的有內容時才顯示提示圖示，避免空白儲存也出現圖案。
        function hasMeaningfulSongNote(note) {
            return Boolean(note && (
                (Array.isArray(note.selected_options) && note.selected_options.length > 0)
                || (note.key_value && note.key_value !== '原 Key')
                || String(note.custom_text || '').trim()
            ));
        }

        socket.on('update_queue', renderQueue);

        // 開啟指定待播歌曲的備註面板，既有備註會先填回表單。
        function openSongNote(filename) {
            editingSongFilename = filename;
            const note = songNotes[filename] || {};
            document.getElementById('song-note-title').textContent = `歌曲備註：${filename.replace('.mp4', '')}`;
            const hasSubtitle = subtitleSongs.has(filename);
            const lyricsOption = hasSubtitle ? '歌詞錯誤待修改' : '想加入歌詞';
            document.getElementById('note-lyrics-label').lastChild.textContent = ` ${lyricsOption}`;
            document.getElementById('note-lyrics').checked = (note.selected_options || []).some((option) => option === lyricsOption || (hasSubtitle && option === '想加入歌詞'));
            editingNoteKeyValue = parseNoteKey(note.key_value);
            renderNoteKeyValue();
            document.getElementById('note-custom-text').value = note.custom_text || '';
            document.getElementById('song-note-panel').style.display = 'block';
        }

        function parseNoteKey(value) {
            const keyNumber = Number.parseInt(String(value || '0').replace('原 Key', '0'), 10);
            return Number.isFinite(keyNumber) ? Math.max(-12, Math.min(12, keyNumber)) : 0;
        }

        function renderNoteKeyValue() {
            const label = editingNoteKeyValue === 0 ? '原 KEY' : `${editingNoteKeyValue > 0 ? '+' : ''}${editingNoteKeyValue}`;
            document.getElementById('note-key-value').textContent = label;
        }

        // 透過左右按鈕快速調整半音，連續點擊即可設定 +2、-2 等數值。
        function adjustNoteKey(step) {
            editingNoteKeyValue = Math.max(-12, Math.min(12, editingNoteKeyValue + step));
            renderNoteKeyValue();
        }

        function resetNoteKey() {
            editingNoteKeyValue = 0;
            renderNoteKeyValue();
        }

        function closeSongNote() {
            document.getElementById('song-note-panel').style.display = 'none';
            editingSongFilename = '';
        }

        // 將表單送到 server，由 server 驗證歌曲仍存在於待播清單。
        function saveSongNote() {
            if (!editingSongFilename) return;
            const selectedOptions = [];
            if (document.getElementById('note-lyrics').checked) selectedOptions.push(subtitleSongs.has(editingSongFilename) ? '歌詞錯誤待修改' : '想加入歌詞');
            socket.emit('song_note_submit', {
                song_filename: editingSongFilename,
                selected_options: selectedOptions,
                key_value: editingNoteKeyValue === 0 ? '原 Key' : `${editingNoteKeyValue > 0 ? '+' : ''}${editingNoteKeyValue}`,
                custom_text: document.getElementById('note-custom-text').value,
            });
            closeSongNote();
        }

        socket.on('song_notes', (notes) => {
            songNotes = notes && typeof notes === 'object' ? notes : {};
            renderQueue(currentQueueHistory);
        });
        socket.on('song_note_updated', (note) => {
            if (!note || !note.song_filename) return;
            songNotes[note.song_filename] = note;
            renderQueue(currentQueueHistory);
        });

        /**
         * Requests removal of one waiting song from the server queue.
         * @param {number} queueIndex Zero-based queue index; index zero is protected.
         */
        function removeQueuedSong(queueIndex) {
            socket.emit('remove_from_queue', { index: queueIndex });
        }

        /** Clears all four song filtering methods and restores the full list. */
        function clearFilters() {
            document.getElementById('search').value = '';
            const filtersToClear = ['song-length-filter', 'singer-filter'];
            if (!getSongSortLanguage()) filtersToClear.push('language-filter');
            filtersToClear.forEach((id) => { document.getElementById(id).value = ''; });
            clearSelectedAffiliations();
            renderCategoryFilters();
            filter();
        }

        /** Resets all category filters while a non-empty search query is entered. */
        function handleSearchInput() {
            if (document.getElementById('search').value) {
                const filtersToClear = ['song-length-filter', 'singer-filter'];
                if (!getSongSortLanguage()) filtersToClear.push('language-filter');
                filtersToClear.forEach((id) => { document.getElementById(id).value = ''; });
                clearSelectedAffiliations();
            }
            renderCategoryFilters();
            filter();
        }

        /** Applies category changes without clearing other categories or the search query. */
        function handleCategoryChange() {
            const sortLanguage = getSongSortLanguage();
            if (sortLanguage && document.getElementById('language-filter').value !== sortLanguage) {
                songSortModeIndex = 1;
                document.getElementById('song-sort-mode').textContent = '熱門';
            }
            renderCategoryFilters();
            filter();
        }

        function songAudioExceptionLabel(filename) {
            const exception = songAudioExceptions[filename];
            if (!exception) return '';
            const labels = [];
            const hasDetailedExceptions = Array.isArray(exception.audio_exceptions) && exception.audio_exceptions.length > 0;
            const modeNames = { guide: '導唱 c2', instrumental: '伴奏 c4' };
            const metricNames = { loudness: 'LUFS', true_peak: 'TP', loudness_range: 'LRA' };
            for (const item of (hasDetailedExceptions ? exception.audio_exceptions : [])) {
                const measured = Number(item.measured);
                if (!Number.isFinite(measured) || !modeNames[item.mode] || !metricNames[item.metric]) continue;
                const value = item.metric === 'true_peak'
                    ? `${measured >= 0 ? '+' : ''}${measured.toFixed(1)} dBTP`
                    : `${measured.toFixed(1)} ${item.unit}`;
                labels.push(`${modeNames[item.mode]} ${metricNames[item.metric]} ${value}（標準 ${item.standard}）`);
            }
            const measuredPeak = Number(exception.c4_true_peak_dbtp);
            const measuredLra = Number(exception.c4_lra_lu);
            if (!hasDetailedExceptions && exception.c4_true_peak_dbtp != null && Number.isFinite(measuredPeak)) {
                labels.push(`c4 TP ${measuredPeak >= 0 ? '+' : ''}${measuredPeak.toFixed(1)} dBTP`);
            }
            if (!hasDetailedExceptions && exception.c4_lra_lu != null && Number.isFinite(measuredLra)) {
                labels.push(`c4 LRA ${measuredLra.toFixed(1)} LU`);
            }
            if (exception.metadata_error) labels.push('特殊歌曲標記無效');
            return labels.length ? `<span class="song-audio-exception">⚠ ${labels.join(' · ')}</span>` : '';
        }

        function filter() {
            const key = document.getElementById('search').value.toLowerCase();
            const selectedLength = document.getElementById('song-length-filter').value;
            const selectedSinger = document.getElementById('singer-filter').value;
            const selectedLanguage = document.getElementById('language-filter').value;
                const selectedAffiliations = getSelectedAffiliations();
            const list = document.getElementById('list');
                const matchingSongs = sortedSongMetadata.filter(({ filename, metadata }) => {
                return filename.toLowerCase().includes(key)
                    && (!selectedLength || metadata.length === selectedLength)
                    && (!selectedSinger || metadata.singer === selectedSinger)
                    && (!selectedLanguage || metadata.language === selectedLanguage)
                    && (!selectedAffiliations.size || selectedAffiliations.has(metadata.affiliation));
                });
                const rows = sortSongEntries(matchingSongs).map(({ filename: s }) => {
                const name = s.replace('.mp4', '');
                const subtitleButton = subtitleSongs.has(s) ? '<button class="song-btn" type="button" disabled title="此歌有字幕">字幕</button>' : '';
                const isPending = pendingSongs.has(s);
                const queueIndex = currentQueueHistory.indexOf(s);
                const isQueued = queueIndex !== -1;
                const isPlaying = queueIndex === 0;
                const statusLabel = isPlaying ? '<span class="song-status">播放中</span>' : isQueued ? '<span class="song-status">已排隊</span>' : '';
                const exceptionLabel = songAudioExceptionLabel(s);
                const playButton = isPending
                    ? '<button class="song-btn added" disabled>已加入</button>'
                    : `<button class="song-btn" onclick="play(this, '${s}')">播歌</button>`;
                return `<li class="song-row ${isPending || isQueued ? 'song-added' : ''} ${isPlaying ? 'song-playing' : ''}" onclick="playSongFromRow(this, '${s}', event)"><span class="song-main"><span class="song-name">${statusLabel}${name}</span>${exceptionLabel}</span><span>${subtitleButton}${playButton}</span></li>`;
            });
            list.innerHTML = rows.join('');
        }

        /**
         * Sends a song to the queue and keeps visible feedback during the request window.
         * @param {HTMLButtonElement} button Clicked play button.
         * @param {string} filename Song filename to queue.
         */
        function play(button, filename) {
            if (pendingSongs.has(filename)) return;
            pendingSongs.add(filename);
            button.disabled = true;
            button.classList.add('added');
            button.textContent = '已加入';
            button.closest('li').classList.add('song-added');
            socket.emit('add_to_queue', {filename: filename}); 
            setTimeout(() => {
                pendingSongs.delete(filename);
                filter();
            }, 1500);
        }

        /**
         * Queues a song when its song row is selected.
         * @param {HTMLLIElement} rowElement Selected song row.
         * @param {string} filename Song filename to queue.
         * @param {MouseEvent} event Click event used to preserve nested button actions.
         */
        function playSongFromRow(rowElement, filename, event) {
            if (event.target.closest('button')) return;
            const playButton = rowElement.querySelector('button[onclick^="play("]');
            if (playButton) play(playButton, filename);
        }

        function cmd(action) { socket.emit('control', action); }

        /** 只在單媒體模式要求目前歌曲快退或快進 10 秒。 */
        function seekSong(seconds) {
            if (seekCorrectionEnabled || (seconds !== -10 && seconds !== 10)) return;
            socket.emit('seek_song', { seconds });
        }

        /** 只在雙媒體模式調整畫面與聲音的相對位置。 */
        function seekVideo(seconds) {
            if (!seekCorrectionEnabled || ![-0.5, -0.1, 0, 0.1, 0.5].includes(seconds)) return;
            socket.emit('seek_video', { seconds });
        }

        function track(mode) {
            currentMode = mode;
            setAudioMode(mode);
            socket.emit('change_track', mode);
        }

        /**
         * Inserts the currently playing song as the next queued song.
         */
        function replayCurrentSong() { socket.emit('replay_current_song'); }

        function loadList() {
            fetch('/api/list').then(r => r.json()).then((songs) => {
                setSongList(songs);
                renderCategoryFilters();
                filter();
            });
        }
        
        loadList();
        loadSubtitleList();
        socket.on('refresh_list', () => { loadList(); loadSubtitleList(); });
    </script>
</body>
</html>
