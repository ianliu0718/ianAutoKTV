<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101414">
  <title>ianAutoKTV 登入</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #101414; color: #f4f7f6; }
    main { width: min(100%, 390px); padding: 28px; border: 1px solid #33413e; border-radius: 18px; background: #1a211f; box-shadow: 0 18px 55px #0007; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 22px; color: #b6c3bf; line-height: 1.55; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input, button { width: 100%; min-height: 48px; border-radius: 10px; font: inherit; }
    input { padding: 0 13px; border: 1px solid #52615d; background: #0e1312; color: inherit; }
    button { margin-top: 14px; border: 0; background: #2aa894; color: #07120f; font-weight: 750; cursor: pointer; }
    .error { margin: 12px 0 0; color: #ff9f9f; }
  </style>
</head>
<body>
  <main>
    <h1>ianAutoKTV</h1>
    <p>輸入管理者提供的登入碼，進入外網 KTV 房間。</p>
    <form method="post" action="{{ url_for('cloud_login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="access_code">登入碼</label>
      <input id="access_code" name="access_code" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">登入</button>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    </form>
  </main>
</body>
</html>
