<!DOCTYPE html>
<html>
<head>
    <title>KTV 播放螢幕</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: Arial; }
        video { width: 100%; height: 100%; object-fit: contain; }
        audio { display: none; }
        #overlay { position: absolute; top: 20px; left: 20px; font-size: 24px; text-shadow: 2px 2px 4px #000; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;}
        #fs-btn { position: absolute; top: 20px; right: 20px; z-index: 50; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-size: 16px; }
        #fs-btn:hover { background: rgba(255,255,255,0.4); }
        #room-library-settings { position: absolute; top: 20px; left: 20px; z-index: 55; padding: 9px 12px; border: 1px solid rgba(255,255,255,.65); border-radius: 7px; color: #fff; background: rgba(0,0,0,.68); font-size: 14px; text-decoration: none; }
        #key-status { position: absolute; top: 8%; left: 50%; z-index: 10; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 14px 24px; border-radius: 8px; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
        #key-status.visible { opacity: 1; visibility: visible; }
        #seek-status { position: absolute; top: 8%; left: 50%; z-index: 10; transform: translate(-50%, 70px); background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 8px; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
        #seek-status.visible { opacity: 1; visibility: visible; }
        #waiting { font-size: 50px; color: #555; cursor: pointer; }
        #engine-status { position: absolute; right: 180px; bottom: 15px; left: 20px; z-index: 40; overflow: hidden; color: #66d9c5; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px #000; display: block; white-space: nowrap; }
        #engine-status.debug-visible { right: 20px; padding: 8px 12px; box-sizing: border-box; background: rgba(0, 0, 0, .72); color: #f9f9c5; border: 1px solid rgba(102, 217, 197, .75); border-radius: 4px; }
        #remote-qr { position: absolute; right: 20px; bottom: 20px; z-index: 20; padding: 12px; background: rgba(255,255,255,0.96); color: #111; border-radius: 8px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
        #remote-qr canvas, #remote-qr img { display: block; margin: 0 auto 8px; }
        #remote-qr-label { font-size: 14px; font-weight: bold; }
        #queue-add-announcement { position: absolute; top: 20px; left: 50%; z-index: 14; max-width: 80%; padding: 10px 18px; transform: translateX(-50%); background: rgba(0,120,90,0.88); color: #fff; border-radius: 6px; text-align: center; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 3px #000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #queue-add-announcement.visible { opacity: 1; }
        #song-announcement { position: absolute; top: 50%; left: 50%; z-index: 15; max-width: 80%; padding: 18px 28px; transform: translate(-50%, -50%); background: rgba(0,0,0,0.78); color: #fff; border-radius: 8px; text-align: center; font-size: clamp(24px, 4vw, 48px); font-weight: bold; line-height: 1.3; text-shadow: 2px 2px 4px #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #song-announcement.visible { opacity: 1; }
        #danmaku-overlay { position: absolute; inset: 0; z-index: 16; width: auto; max-width: none; height: 100%; overflow: hidden; pointer-events: none; }
        #danmaku-overlay .danmaku-item { position: absolute; left: 0; display: block; max-width: 82vw; padding: 10px 22px; color: #fff; background: rgba(126, 91, 132, .72); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; font-size: clamp(20px, 3vw, 36px); font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,.7); overflow-wrap: anywhere; animation: danmaku-slide var(--danmaku-duration, 12s) linear forwards; }
        @keyframes danmaku-slide { from { opacity: 0; transform: translateX(calc(100vw + 110%)); } 8% { opacity: 1; } 88% { opacity: 1; } to { opacity: 0; transform: translateX(-110%); } }
        #photo-overlay { position: absolute; inset: 0; z-index: 17; display: flex; align-items: center; justify-content: center; padding: 5%; pointer-events: none; }
        #photo-overlay .photo-item { max-width: min(82vw, 720px); max-height: 78%; object-fit: contain; border: 5px solid white; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.72); animation: photo-pop 5s ease-in-out forwards; }
        #photo-overlay .sticker-item { max-width: min(42vw, 360px); max-height: 45%; object-fit: contain; animation: photo-pop 5s ease-in-out forwards; }
        @keyframes photo-pop { 0%, 8% { opacity: 0; transform: scale(.92); } 18%, 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.97); } }
        #ktv-subtitle { position: absolute; right: 0; bottom: 9%; left: 0; z-index: 12; display: flex; flex-direction: column; gap: 7px; pointer-events: none; font-size: clamp(calc(22px * var(--subtitle-scale, 2)), calc(3.6vw * var(--subtitle-scale, 2)), calc(44px * var(--subtitle-scale, 2))); font-weight: bold; line-height: 1.2; }
        #ktv-subtitle .subtitle-line { position: relative; display: block; max-width: 50%; color: #fff; }
        #ktv-subtitle .subtitle-line:first-child { align-self: flex-start; text-align: right; }
        #ktv-subtitle .subtitle-line:nth-child(2) { align-self: flex-end; text-align: left; }
        #ktv-subtitle .subtitle-line:only-child { align-self: center; max-width: 90%; text-align: center; }
        #ktv-subtitle .subtitle-text-layer { display: block; white-space: pre-wrap; }
        #ktv-subtitle .subtitle-char { display: inline-block; animation: none; transform: none; opacity: 1; }
        #ktv-subtitle.subtitle-mode-single .subtitle-line:not(:first-child) { display: none; }
        #ktv-subtitle.subtitle-mode-single .subtitle-line:first-child { align-self: center; max-width: 90%; text-align: center; }
        #ktv-subtitle.subtitle-mode-single .subtitle-line { min-height: 1.2em; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line,
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line { width: 50%; max-width: 50%; min-height: 1.2em; flex: 0 0 50%; white-space: nowrap; font-family: "Arial Rounded MT Bold", "Microsoft JhengHei", sans-serif; font-weight: 900; letter-spacing: .02em; -webkit-text-stroke: 2px #101820; paint-order: stroke fill; text-shadow: 0 4px 8px rgba(0,0,0,.8); }
        #ktv-subtitle.subtitle-mode-double .subtitle-line:first-child,
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line:first-child { align-self: flex-start; text-align: right; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line:nth-child(2),
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line:nth-child(2) { align-self: flex-end; text-align: left; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line .subtitle-text-layer,
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line .subtitle-text-layer { width: max-content; white-space: nowrap; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line:first-child .subtitle-text-layer,
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line:first-child .subtitle-text-layer { margin-left: auto; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line:nth-child(2) .subtitle-text-layer,
        #ktv-subtitle.subtitle-mode-gradient .subtitle-line:nth-child(2) .subtitle-text-layer { margin-right: auto; }
        #ktv-subtitle.subtitle-mode-double .subtitle-line { color: #fff; }
        #ktv-subtitle.subtitle-mode-gradient .subtitle-base-layer { color: #fff; }
        #ktv-subtitle.subtitle-mode-gradient .subtitle-highlight-layer { position: absolute; inset: 0; overflow: hidden; color: #ffe66d; clip-path: inset(0 calc(100% - var(--subtitle-progress, 0%)) 0 0); }
        #ktv-subtitle.subtitle-style-background.subtitle-mode-gradient .subtitle-highlight-layer { top: .08em; right: auto; bottom: auto; left: .3em; margin: 0; }
        #ktv-subtitle.subtitle-style-background.subtitle-mode-gradient .subtitle-line:first-child .subtitle-highlight-layer { right: .3em; left: auto; }
        #ktv-subtitle.plain-lyrics-mode { top: 3%; right: 2%; bottom: 3%; left: auto; width: min(var(--plain-lyrics-width, 48vw), 70%); max-width: 70%; min-width: 24%; height: 94%; box-sizing: border-box; justify-content: flex-start; gap: 0; overflow: hidden; padding: 2.5vh 1.5vw; border-radius: 8px; font-size: clamp(calc(12px * var(--subtitle-scale, 1)), calc(min(2.6vw, 5vh) * var(--subtitle-scale, 1)), calc(38px * var(--subtitle-scale, 1))); line-height: 1.12; text-align: right; }
        #ktv-subtitle.plain-lyrics-mode .plain-lyrics-track { display: flex; flex: 0 0 auto; flex-direction: column; width: 100%; }
        #ktv-subtitle.plain-lyrics-mode .subtitle-line { flex: 1 1 0; align-self: stretch; max-width: none; min-height: 0; text-align: right; display: flex; align-items: center; justify-content: flex-end; overflow: hidden; }
        #ktv-subtitle.plain-lyrics-mode.subtitle-mode-single .subtitle-line:not(:first-child) { display: flex; }
        #ktv-subtitle.plain-lyrics-mode.subtitle-mode-single .subtitle-line:first-child { align-self: stretch; max-width: none; text-align: right; }
        #ktv-subtitle.plain-lyrics-mode .subtitle-text-layer { white-space: nowrap; }
        /* Subtitle style classes are mutually exclusive; background covers lines or the plain-lyrics panel. */
        #ktv-subtitle.subtitle-style-background:not(.plain-lyrics-mode) .subtitle-line { box-decoration-break: clone; padding: .08em .3em; border-radius: 4px; background: rgba(0, 0, 0, .62); }
        #ktv-subtitle.subtitle-style-background.plain-lyrics-mode { background: rgba(0, 0, 0, .62); }
        #ktv-subtitle.subtitle-style-shadow { text-shadow: 5px 5px 10px #000, -4px -4px 8px #000, 0 0 18px #000; }
        @media (prefers-reduced-motion: reduce) {
            #ktv-subtitle .subtitle-char { animation: none; transition: none; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const soundTouchModulePromise = import("https://esm.sh/@soundtouchjs/audio-worklet@2.1.1?bundle");
        const soundTouchProcessorUrl = "https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.1.1/.dist/soundtouch-processor.js";
    </script>
</head>
<body>
    {% if room_code %}<a id="room-library-settings" href="/remote" target="_blank" rel="noopener">☁ 設定房間歌庫／開啟遙控器</a>{% endif %}
    <div id="overlay">等待連線...</div>
    <div id="fs-btn" onclick="toggleFullScreen()">⛶ 全螢幕</div>
    <div id="key-status">KEY：原 KEY (0)</div>
    <div id="seek-status">畫面延遲：0 秒</div>
    <div id="queue-add-announcement"></div>
    <div id="song-announcement"></div>
    <div id="danmaku-overlay"></div>
    <div id="photo-overlay"></div>
    <div id="ktv-subtitle" aria-live="polite"></div>
    <div id="engine-status">音訊引擎：尚未啟動</div>
    <div id="remote-qr"><div id="remote-qr-code"></div><div id="remote-qr-label">房號 {{ room_code }}<br>掃描加入遙控器</div></div>
    <div id="waiting" onclick="initAudioContext()">📺 點擊此處啟動音效引擎：單媒體</div>
    <video id="vid" playsinline crossorigin="anonymous">
        <track id="subtitle-track" kind="subtitles" srclang="zh" label="字幕">
    </video>
    <audio id="audio-track" crossorigin="anonymous"></audio>

    <script>
        const socket = io();
        const video = document.getElementById('vid');
        const audioTrack = document.getElementById('audio-track');
        const overlay = document.getElementById('overlay');
        const fsButton = document.getElementById('fs-btn');
        const keyStatus = document.getElementById('key-status');
        const seekStatus = document.getElementById('seek-status');
        const waiting = document.getElementById('waiting');
            /** Clears subtitles and notifies the server once when the current song reaches its natural end. */
            function handleVideoEnded() {
                const endedFilename = currentFilename;
                const endedGeneration = playbackGeneration;
                if (!endedFilename || endedPlaybackGeneration === endedGeneration) return;
                endedPlaybackGeneration = endedGeneration;
                clearCurrentSubtitle();
                socket.emit('song_ended', { filename: endedFilename });
            }
            video.onended = handleVideoEnded;
        const engineStatus = document.getElementById('engine-status');
        const songAnnouncement = document.getElementById('song-announcement');
        const queueAddAnnouncement = document.getElementById('queue-add-announcement');
        const danmakuOverlay = document.getElementById('danmaku-overlay');
        const photoOverlay = document.getElementById('photo-overlay');
        let subtitleTrack = document.getElementById('subtitle-track');
        const ktvSubtitle = document.getElementById('ktv-subtitle');
        const remoteQr = document.getElementById('remote-qr');
        const remoteQrCode = document.getElementById('remote-qr-code');
        
        let audioCtx, source, splitter, audioGains, legacyStereoGains, merger, guideMixGain, legacyGuideGain, instrumentalModeGain, masterGain, soundTouchNode, pitchShift, liveLoudnessAnalyser;
        let isAudioSetup = false;
        let audioSetupPromise;
        let useSoundTouch = false;
        let audioModeRequestId = 0;
        let seekCorrectionEnabled = false;
        let currentSeekOffset = 0;
        let currentMode = 'stereo';
        let currentVolume = 1;
        let currentKey = 0;
        let currentFilename = '';
        let currentSubtitleMode = 0;
        let subtitleHighlightFrame = 0;
        let plainLyricsScrollFrame = 0;
        let renderedSubtitleSlotIndex = -1;
        let renderedSubtitleActiveLineIndex = 0;
        let currentSubtitleStyleMode = 0;
        let currentLoudness = null;
        let liveLoudness = null;
        let liveLoudnessTimer = null;
        let currentChannelLayout = '';
        let currentActiveChannels = '';
        let isSixChannelAudio = false;
        let guideVocalControlSupported = false;
        let currentVocalLevel = 50;
        let clapBufferPromise;
        let announcementTimer;
        let queueAddAnnouncementTimer;
        let keyStatusTimer;
        let seekStatusTimer;
        let lastDualSyncTime = 0;
        // 播放端若因瀏覽器 autoplay 限制暫時無法播放，保留最後一筆播放資料供使用者點擊後重試。
        let pendingPlaybackData = null;
        let playbackGeneration = 0;
        let endedPlaybackGeneration = -1;

        /** Toggles fullscreen for the playback page. */
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                const target = document.documentElement;
                if (target.requestFullscreen) target.requestFullscreen();
                else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function updateFullScreenButton() {
            if (fsButton) fsButton.textContent = document.fullscreenElement ? '⛶ 退出全螢幕' : '⛶ 全螢幕';
        }

        document.addEventListener('fullscreenchange', updateFullScreenButton);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        /**
         * Updates the KEY value shown on the playback screen.
         * @param {number} keyValue Current pitch offset in semitones.
         */
        function updateKeyStatus(keyValue) {
            keyStatus.innerText = keyValue === 0 ? 'KEY：原 KEY (0)' : `KEY：${keyValue > 0 ? '+' : ''}${keyValue}`;
            clearTimeout(keyStatusTimer);
            keyStatus.classList.add('visible');
            keyStatusTimer = setTimeout(() => keyStatus.classList.remove('visible'), 3000);
        }

        /**
         * Shows the accumulated video-only offset briefly on the playback screen.
         * @param {number} seconds Signed accumulated video position offset in seconds.
         */
        function updateSeekStatus(seconds) {
            seekStatus.innerText = seconds === 0
                ? '畫面同步'
                : seconds > 0
                    ? `畫面延遲：${seconds.toFixed(1)} 秒（聲音提前）`
                    : `畫面提前：${Math.abs(seconds).toFixed(1)} 秒（聲音落後）`;
            clearTimeout(seekStatusTimer);
            seekStatus.classList.add('visible');
            seekStatusTimer = setTimeout(() => seekStatus.classList.remove('visible'), 3000);
        }

        function updatePlaybackModeStatus(mode) {
            if (!waiting) return;
            if (mode === 'dual') {
                waiting.innerText = '📺 點擊此處啟動音效引擎：雙媒體';
            } else {
                waiting.innerText = '📺 點擊此處啟動音效引擎：單媒體';
            }
        }

        function stripFileExtension(filename) {
            return String(filename || '').replace(/\.(mp4|mkv|avi|mov)$/i, '');
        }

        /**
         * Shows the filename that was successfully added to the playback queue.
         * @param {string} filename Newly queued song filename.
         */
        function showQueueAddAnnouncement(filename) {
            clearTimeout(queueAddAnnouncementTimer);
            queueAddAnnouncement.textContent = `已加入待播：${stripFileExtension(filename)}`;
            queueAddAnnouncement.classList.add('visible');
            queueAddAnnouncementTimer = setTimeout(() => queueAddAnnouncement.classList.remove('visible'), 5000);
        }

        /**
         * Shows the playing filename in the center of the playback screen for ten seconds.
         * @param {string} filename Current song filename.
         */
        function showSongAnnouncement(filename) {
            clearTimeout(announcementTimer);
            songAnnouncement.textContent = stripFileExtension(filename);
            songAnnouncement.classList.add('visible');
            announcementTimer = setTimeout(() => songAnnouncement.classList.remove('visible'), 10000);
        }

        function showDanmaku(text) {
            const danmakuItem = document.createElement('span');
            danmakuItem.className = 'danmaku-item';
            danmakuItem.textContent = text;
            danmakuItem.style.top = `${15 + Math.random() * 65}%`;
            danmakuItem.style.setProperty('--danmaku-duration', `${10 + Math.random() * 4}s`);
            danmakuItem.addEventListener('animationend', () => danmakuItem.remove(), { once: true });
            danmakuOverlay.appendChild(danmakuItem);
        }

        function showPhoto(data) {
            if (!data || !data.data) return;
            const photo = document.createElement('img');
            photo.className = 'photo-item';
            photo.src = data.data;
            photo.alt = '現場照片';
            photo.addEventListener('animationend', () => photo.remove(), { once: true });
            photoOverlay.appendChild(photo);
        }

        function showSticker(data) {
            const filename = String(data && data.filename || '');
            if (!filename || filename !== filename.split(/[\\/]/).pop() || !/\.(gif|webp|png)$/i.test(filename)) return;
            const sticker = document.createElement('img');
            sticker.className = 'sticker-item';
            sticker.src = `/static/stickers/${encodeURIComponent(filename)}`;
            sticker.alt = '情緒貼圖';
            sticker.addEventListener('animationend', () => sticker.remove(), { once: true });
            photoOverlay.appendChild(sticker);
        }

        async function playSoundEffect(effect) {
            if (effect !== 'clap' || !audioCtx) return;
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!clapBufferPromise) {
                clapBufferPromise = fetch('/effects/clap.wav')
                    .then(response => response.ok ? response.arrayBuffer() : Promise.reject(new Error('音效載入失敗')))
                    .then(bufferData => audioCtx.decodeAudioData(bufferData));
            }
            try {
                const buffer = await clapBufferPromise;
                const sourceNode = audioCtx.createBufferSource();
                const gainNode = audioCtx.createGain();
                const duration = Math.min(buffer.duration, 4);
                const fadeInDuration = Math.min(0.08, duration / 3);
                const fadeOutDuration = Math.min(0.35, duration / 3);
                const now = audioCtx.currentTime;
                sourceNode.buffer = buffer;
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.linearRampToValueAtTime(0.75, now + fadeInDuration);
                gainNode.gain.setValueAtTime(0.75, now + duration - fadeOutDuration);
                gainNode.gain.linearRampToValueAtTime(0.0001, now + duration);
                sourceNode.connect(gainNode).connect(audioCtx.destination);
                sourceNode.start(now, 0, duration);
            } catch (error) {
                clapBufferPromise = null;
                console.warn('音效無法播放', error);
            }
        }

        /**
         * Creates the QR Code that opens the current server's remote control page.
         */
        function createRemoteQrCode() {
            if (typeof QRCode === 'undefined') return;
            new QRCode(remoteQrCode, {
                text: {{ room_join_url|tojson }},
                width: 150,
                height: 150,
                colorDark: '#111111',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M,
            });
        }

        /**
         * Applies the server's QR Code visibility state to the playback screen.
         * @param {Object} data QR Code visibility state with a visible field.
         */
        function updateRemoteQrVisibility(data) {
            remoteQr.style.display = data.visible ? 'block' : 'none';
        }

        createRemoteQrCode();
        socket.on('qr_visibility', updateRemoteQrVisibility);

        let currentQueueHistory = [];
        let currentEngineSummary = '音訊引擎：尚未啟動';
        let engineDebugEnabled = false;

        function buildQueueHistoryText(playlist) {
            const queueEntries = Array.isArray(playlist) ? playlist.map((entry) => stripFileExtension(entry)) : [];
            if (!queueEntries.length) return '播放清單：無';
            const availableWidth = Math.max(120, engineStatus.getBoundingClientRect().width);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = getComputedStyle(engineStatus).font;
            const prefix = '播放清單：';
            const separator = ' | ';
            let visibleEntries = [];
            for (const entry of queueEntries) {
                const candidate = `${prefix}${[...visibleEntries, entry].join(separator)}`;
                const remaining = visibleEntries.length + 1 < queueEntries.length;
                const withSuffix = remaining ? `${candidate}${separator}...` : candidate;
                if (context.measureText(withSuffix).width > availableWidth) break;
                visibleEntries.push(entry);
            }
            if (!visibleEntries.length) {
                visibleEntries = [queueEntries[0]];
            }
            const hasHiddenEntries = visibleEntries.length < queueEntries.length;
            return `${prefix}${visibleEntries.join(separator)}${hasHiddenEntries ? `${separator}...` : ''}`;
        }

        function renderEngineStatus() {
            engineStatus.innerText = engineDebugEnabled ? currentEngineSummary : buildQueueHistoryText(currentQueueHistory);
        }

        /**
         * Shows the audio processor currently used by the player.
         * @param {string} message Engine name and optional diagnostic detail.
         */
        function setEngineStatus(message) {
            const loudness = liveLoudness ?? currentLoudness;
            const volumeText = loudness === null ? '' : `｜即時 LUFS：${loudness.toFixed(1)}`;
            const channelText = currentChannelLayout ? `｜聲道模式：${currentChannelLayout}` : '';
            const sourceText = source ? `｜WebAudio：${source.channelCount}ch/${source.channelCountMode}` : '';
            const activeText = currentActiveChannels ? `｜啟用：${currentActiveChannels}` : '';
            currentEngineSummary = `音訊引擎：${message}${volumeText}${channelText}${sourceText}${activeText}`;
            renderEngineStatus();
        }

        /** Estimates the current output loudness from the Web Audio signal. */
        function updateLiveLoudness() {
            if (!liveLoudnessAnalyser) return;
            const samples = new Float32Array(liveLoudnessAnalyser.fftSize);
            liveLoudnessAnalyser.getFloatTimeDomainData(samples);
            const rms = Math.sqrt(samples.reduce((sum, sample) => sum + sample * sample, 0) / samples.length);
            liveLoudness = rms > 0.00001 ? Math.max(-60, 20 * Math.log10(rms)) : -60;
            setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
        }

        /**
         * Loads the current song's matching WebVTT file and controls its visibility.
         * @param {string} filename Current MP4 filename.
         * @param {boolean} visible Whether subtitles should be visible.
         */
        function setSubtitle(filename, mode) {
            const nextTrack = subtitleTrack.cloneNode(false);
            subtitleTrack.replaceWith(nextTrack);
            subtitleTrack = nextTrack;
            subtitleTrack.track.addEventListener('cuechange', renderKtvSubtitle);
            currentFilename = filename;
            applySubtitleMode(mode);
            if (!filename || !mode) {
                subtitleTrack.src = '';
                subtitleTrack.track.mode = 'disabled';
                ktvSubtitle.style.display = 'none';
                ktvSubtitle.classList.remove('plain-lyrics-mode');
                ktvSubtitle.replaceChildren();
                return;
            }
            const subtitlePath = `/subtitles/${encodeURIComponent(filename.replace(/\.mp4$/i, '.vtt'))}`;
            subtitleTrack.src = `${subtitlePath}?t=${Date.now()}`;
            subtitleTrack.track.mode = 'hidden';
            ktvSubtitle.style.display = 'flex';
            ktvSubtitle.classList.remove('plain-lyrics-mode');
            ktvSubtitle.replaceChildren();
        }

        /**
         * Applies the shared subtitle font size sent by the remote control.
         * @param {number} fontSize Subtitle size percentage.
         */
        function applySubtitleFontSize(fontSize) {
            const size = Number(fontSize);
            if (!Number.isFinite(size) || size < 80 || size > 200) return;
            ktvSubtitle.style.setProperty('--subtitle-scale', String(size / 100));
            if (ktvSubtitle.classList.contains('plain-lyrics-mode') || currentSubtitleMode >= 3) renderKtvSubtitle();
        }

        /** Applies the shared hidden, single-line, double-line, or gradient mode. */
        function applySubtitleMode(mode) {
            const value = Number(mode);
            if (!Number.isInteger(value) || value < 0 || value > 4) return;
            currentSubtitleMode = value;
            const modeClasses = ['subtitle-mode-general', 'subtitle-mode-single', 'subtitle-mode-double', 'subtitle-mode-gradient'];
            ktvSubtitle.classList.remove(...modeClasses);
            if (value > 0) ktvSubtitle.classList.add(modeClasses[value - 1]);
            if (value === 4) requestSubtitleHighlightProgress();
            else if (subtitleHighlightFrame) {
                cancelAnimationFrame(subtitleHighlightFrame);
                subtitleHighlightFrame = 0;
            }
            if (ktvSubtitle.style.display !== 'none') renderKtvSubtitle();
        }

        /** Applies the selected background or shadow mode to the subtitle root. */
        function applySubtitleStyleMode(mode) {
            const value = Number(mode);
            if (!Number.isInteger(value) || value < 0 || value > 1) return;
            currentSubtitleStyleMode = value;
            const styleClasses = ['subtitle-style-background', 'subtitle-style-shadow'];
            ktvSubtitle.classList.remove(...styleClasses);
            ktvSubtitle.classList.add(styleClasses[value]);
        }

        /**
         * Wraps subtitle text in animated characters for the KTV entrance effect.
         * @param {string} text Subtitle line text.
         * @returns {HTMLSpanElement} Rendered subtitle text layer.
         */
        function createSubtitleTextLayer(text, layerClass = '') {
            const layer = document.createElement('span');
            layer.className = ['subtitle-text-layer', layerClass].filter(Boolean).join(' ');
            Array.from(text).forEach((character, index) => {
                const characterElement = document.createElement('span');
                characterElement.className = 'subtitle-char';
                characterElement.style.setProperty('--char-index', String(index));
                characterElement.textContent = character;
                layer.appendChild(characterElement);
            });
            return layer;
        }

        function getSubtitleTextLines(text) {
            return String(text || '').replace(/<[^>]*>/g, '').split(/\r?\n/).filter(Boolean);
        }

        function getSubtitleSlots() {
            const cues = subtitleTrack.track.cues;
            if (!cues) return [];
            const slots = [];
            for (let index = 0; index < cues.length; index += 1) {
                const cue = cues[index];
                const plainLyrics = String(cue.id || '').startsWith('PLAIN_LYRICS_');
                slots.push({ cue, text: getSubtitleTextLines(cue.text).join(plainLyrics ? '\n' : ' '), startTime: cue.startTime, endTime: cue.endTime });
                const nextCue = cues[index + 1];
                if (nextCue && nextCue.startTime > cue.endTime + 0.05) {
                    slots.push({ cue: null, text: '', startTime: cue.endTime, endTime: nextCue.startTime });
                }
            }
            return slots.map((slot, index) => ({ ...slot, index }));
        }

        function getSubtitleCueIndex(currentCue) {
            return getSubtitleSlots().find((slot) => slot.cue === currentCue)?.index ?? -1;
        }

        function createSubtitleLineElement(text, progress = 0) {
            const lineElement = document.createElement('span');
            lineElement.className = 'subtitle-line';
            if (currentSubtitleMode === 4) {
                lineElement.style.setProperty('--subtitle-progress', `${Math.round(progress * 100)}%`);
                lineElement.appendChild(createSubtitleTextLayer(text, 'subtitle-base-layer'));
                lineElement.appendChild(createSubtitleTextLayer(text, 'subtitle-highlight-layer'));
            } else {
                lineElement.appendChild(createSubtitleTextLayer(text));
            }
            return lineElement;
        }

        function fitSubtitleLineAnchors() {
            if (currentSubtitleMode < 3 || ktvSubtitle.classList.contains('plain-lyrics-mode')) return;
            const containerWidth = ktvSubtitle.clientWidth;
            const halfWidth = containerWidth / 2;
            Array.from(ktvSubtitle.querySelectorAll('.subtitle-line')).slice(0, 2).forEach((lineElement) => {
                const textLayer = lineElement.querySelector('.subtitle-base-layer, .subtitle-text-layer');
                const textWidth = textLayer ? textLayer.scrollWidth : lineElement.scrollWidth;
                const availableWidth = Math.max(1, containerWidth - 12);
                const fontScale = textWidth > availableWidth ? availableWidth / textWidth : 1;
                lineElement.style.fontSize = `${fontScale}em`;
                const fittedTextWidth = textWidth * fontScale;
                const lineWidth = Math.min(containerWidth, Math.max(halfWidth, fittedTextWidth));
                lineElement.style.width = `${lineWidth}px`;
                lineElement.style.maxWidth = 'none';
                lineElement.style.flex = '0 0 auto';
            });
        }

        function requestSubtitleHighlightProgress() {
            if (!subtitleHighlightFrame) subtitleHighlightFrame = requestAnimationFrame(updateSubtitleHighlightProgress);
        }

        function requestPlainLyricsScroll() {
            if (!plainLyricsScrollFrame) plainLyricsScrollFrame = requestAnimationFrame(updatePlainLyricsScroll);
        }

        function updatePlainLyricsScroll() {
            plainLyricsScrollFrame = 0;
            const state = ktvSubtitle._plainLyricsState;
            const track = ktvSubtitle.querySelector('.plain-lyrics-track');
            if (!state || !track) return;
            const duration = state.scrollEndTime - state.scrollStartTime;
            const progress = state.hasNextLine && duration > 0
                ? Math.max(0, Math.min(1, (video.currentTime - state.scrollStartTime) / duration))
                : 0;
            track.style.transform = `translate3d(0, ${-state.lineHeight * progress}px, 0)`;
            if (!video.paused && !video.ended) requestPlainLyricsScroll();
        }

        function syncSubtitleSlotAtCurrentTime() {
            if (currentSubtitleMode < 3 || ktvSubtitle.style.display === 'none') return;
            const activeCues = subtitleTrack.track.activeCues;
            const currentCue = activeCues && activeCues[0];
            const slots = getSubtitleSlots();
            const currentSlot = currentCue
                ? slots.find((slot) => slot.cue === currentCue)
                : slots.find((slot) => !slot.cue && video.currentTime >= slot.startTime && video.currentTime < slot.endTime);
            if ((currentSlot?.index ?? -1) !== renderedSubtitleSlotIndex) renderKtvSubtitle();
            if (currentSubtitleMode === 4) requestSubtitleHighlightProgress();
        }

        function updateSubtitleHighlightProgress() {
            subtitleHighlightFrame = 0;
            if (currentSubtitleMode !== 4 || ktvSubtitle.style.display === 'none') return;
            const activeCues = subtitleTrack.track.activeCues;
            const currentCue = activeCues && activeCues[0];
            if (!currentCue) return;
            const slots = getSubtitleSlots();
            const currentSlot = currentCue
                ? slots.find((slot) => slot.cue === currentCue)
                : slots.find((slot) => !slot.cue && video.currentTime >= slot.startTime && video.currentTime < slot.endTime);
            if ((currentSlot?.index ?? -1) !== renderedSubtitleSlotIndex) {
                renderKtvSubtitle();
                return;
            }
            const cueIndex = currentCue ? getSubtitleCueIndex(currentCue) : -1;
            const activeLine = ktvSubtitle.querySelectorAll('.subtitle-line')[renderedSubtitleActiveLineIndex];
            if (currentCue && activeLine) {
                const duration = currentCue.endTime - currentCue.startTime;
                const progress = duration > 0 ? Math.max(0, Math.min(1, (video.currentTime - currentCue.startTime) / duration)) : 0;
                activeLine.style.setProperty('--subtitle-progress', `${progress * 100}%`);
            }
            requestSubtitleHighlightProgress();
        }

        /**
         * Renders the active VTT cue as either a sliding plain-lyrics window or two KTV lines.
         */
        function renderKtvSubtitle() {
            const activeCues = subtitleTrack.track.activeCues;
            const slots = getSubtitleSlots();
            const currentCue = activeCues && activeCues[0];
            let currentSlot = currentCue
                ? slots.find((slot) => slot.cue === currentCue)
                : slots.find((slot) => !slot.cue && video.currentTime >= slot.startTime && video.currentTime < slot.endTime);
            if (!currentSlot && currentSubtitleMode > 0 && slots.length) {
                currentSlot = { cue: null, text: '', startTime: video.currentTime, endTime: video.currentTime, index: -1 };
            }
            if (!currentSlot) {
                renderedSubtitleSlotIndex = -1;
                renderedSubtitleActiveLineIndex = 0;
                ktvSubtitle.replaceChildren();
                ktvSubtitle.classList.remove('plain-lyrics-mode');
                ktvSubtitle._plainLyricsState = null;
                ktvSubtitle.style.removeProperty('--plain-lyrics-width');
                return;
            }
            renderedSubtitleSlotIndex = currentSlot.index;
            const plainLyrics = Boolean(currentCue && currentCue.id.startsWith('PLAIN_LYRICS_'));
            const currentLines = getSubtitleTextLines(currentSlot.text);
            if (currentSubtitleMode === 1) {
                renderPlainLyricsWindow(currentSlot, slots, currentCue, currentLines, plainLyrics && currentLines.length > 1);
                return;
            }
            let displayLines = currentSubtitleMode === 2 ? currentLines.slice(0, 1) : currentLines.slice();
            let activeLineIndex = 0;
            let currentProgress = 0;
            if (!currentCue || !currentLines.length) {
                displayLines = currentSubtitleMode === 2 ? [''] : ['', ''];
            } else if (plainLyrics && currentLines.length > 1 && currentSubtitleMode >= 3) {
                displayLines = currentLines.slice(0, 2);
                const duration = currentSlot.endTime - currentSlot.startTime;
                currentProgress = duration > 0 ? Math.max(0, Math.min(1, (video.currentTime - currentSlot.startTime) / duration)) : 0;
            } else if (currentSubtitleMode >= 3) {
                const nextSlot = slots[currentSlot.index + 1];
                const nextText = nextSlot ? nextSlot.text : '';
                const currentText = currentLines.join(' ');
                const previousSlot = slots[currentSlot.index - 1];
                if (previousSlot && !previousSlot.cue) {
                    displayLines = nextText ? [currentText, nextText] : [currentText];
                    activeLineIndex = 0;
                } else if (nextSlot && !nextSlot.cue) {
                    displayLines = [currentText, ''];
                    activeLineIndex = 0;
                } else if (currentSlot.index % 2 === 1) {
                    displayLines = nextText ? [nextText, currentText] : [currentText];
                    activeLineIndex = nextText ? 1 : 0;
                } else {
                    displayLines = nextText ? [currentText, nextText] : [currentText];
                    activeLineIndex = 0;
                }
                const duration = currentSlot.endTime - currentSlot.startTime;
                currentProgress = currentSlot.cue && duration > 0 ? Math.max(0, Math.min(1, (video.currentTime - currentSlot.startTime) / duration)) : 0;
            }
            renderedSubtitleActiveLineIndex = activeLineIndex;
            displayLines.splice(2);
            ktvSubtitle.classList.remove('plain-lyrics-mode');
            ktvSubtitle.replaceChildren(...displayLines.map((line, index) => createSubtitleLineElement(line, index === activeLineIndex ? currentProgress : 0)));
            fitSubtitleLineAnchors();
            ktvSubtitle._plainLyricsState = null;
            ktvSubtitle.style.removeProperty('--plain-lyrics-width');
        }

        /** Builds the general-mode twelve-line window from per-line cues or legacy rolling cues. */
        function renderPlainLyricsWindow(currentSlot, slots, currentCue, currentLines, legacyWindow) {
            let trackLines;
            let hasNextLine = false;
            let nextCueDuration = 0;
            if (legacyWindow) {
                const nextSlot = slots[currentSlot.index + 1];
                const nextLines = nextSlot && nextSlot.cue && String(nextSlot.cue.id || '').startsWith('PLAIN_LYRICS_')
                    ? getSubtitleTextLines(nextSlot.text)
                    : [];
                hasNextLine = nextLines.length === currentLines.length && currentLines.length > 0
                    && currentLines.slice(1).every((line, index) => line === nextLines[index]);
                trackLines = hasNextLine ? [...currentLines, nextLines[nextLines.length - 1]] : currentLines;
                nextCueDuration = nextSlot ? nextSlot.endTime - nextSlot.startTime : 0;
            } else {
                const lyricSlots = slots.slice();
                if (!lyricSlots.includes(currentSlot)) {
                    const insertionIndex = lyricSlots.findIndex((slot) => slot.startTime > currentSlot.startTime);
                    lyricSlots.splice(insertionIndex < 0 ? lyricSlots.length : insertionIndex, 0, currentSlot);
                }
                const lyricLines = lyricSlots.flatMap((slot) => {
                    const lines = slot.cue ? getSubtitleTextLines(slot.text) : [];
                    return lines.length ? lines.map((text) => ({ slot, text })) : [{ slot, text: '' }];
                });
                const currentIndex = Math.max(0, lyricLines.findIndex((line) => line.slot === currentSlot));
                const leadingRows = Math.max(0, 6 - currentIndex);
                const windowStart = Math.max(0, currentIndex - 6);
                const visibleLines = lyricLines.slice(windowStart, windowStart + 13 - leadingRows);
                hasNextLine = currentIndex < lyricLines.length - 1;
                trackLines = [...Array(leadingRows).fill(''), ...visibleLines.map((line) => line.text)];
                const nextLineSlot = lyricLines[currentIndex + 1]?.slot;
                nextCueDuration = nextLineSlot ? nextLineSlot.endTime - nextLineSlot.startTime : 0;
            }
            const scrollStartTime = currentSlot.startTime === 0 && hasNextLine
                ? Math.max(currentSlot.startTime, currentSlot.endTime - nextCueDuration)
                : currentSlot.startTime;
            ktvSubtitle.classList.add('plain-lyrics-mode');
            const rowCount = Math.max(12, trackLines.length);
            const track = document.createElement('div');
            track.className = 'plain-lyrics-track';
            track.style.height = `${rowCount / 12 * 100}%`;
            trackLines.forEach((line) => {
                const lineElement = createSubtitleLineElement(line);
                lineElement.style.flex = `0 0 ${100 / rowCount}%`;
                track.appendChild(lineElement);
            });
            ktvSubtitle.replaceChildren(track);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = getComputedStyle(ktvSubtitle).font;
            const longestLine = Math.max(...trackLines.map((line) => context.measureText(line).width), 0);
            const width = Math.min(window.innerWidth * 0.7, Math.max(window.innerWidth * 0.24, longestLine + window.innerWidth * 0.04));
            ktvSubtitle.style.setProperty('--plain-lyrics-width', `${Math.round(width)}px`);
            const subtitleStyle = getComputedStyle(ktvSubtitle);
            const horizontalPadding = parseFloat(subtitleStyle.paddingLeft) + parseFloat(subtitleStyle.paddingRight);
            const availableWidth = Math.max(1, ktvSubtitle.clientWidth - horizontalPadding);
            const rowHeight = track.querySelector('.subtitle-line')?.getBoundingClientRect().height || 0;
            const fontSize = parseFloat(subtitleStyle.fontSize) || 1;
            const lineHeight = parseFloat(subtitleStyle.lineHeight) || fontSize * 1.12;
            trackLines.forEach((line, index) => {
                const measuredWidth = context.measureText(line).width;
                const widthScale = measuredWidth > availableWidth ? availableWidth / measuredWidth : 1;
                const heightScale = rowHeight > 0 ? Math.min(1, rowHeight / lineHeight) : 1;
                track.children[index].style.fontSize = `${Math.min(widthScale, heightScale)}em`;
            });
            ktvSubtitle._plainLyricsState = {
                scrollStartTime,
                scrollEndTime: currentSlot.endTime,
                lineHeight: track.querySelector('.subtitle-line')?.getBoundingClientRect().height || 0,
                hasNextLine,
            };
            requestPlainLyricsScroll();
        }

        /**
         * Connects VTT cue changes to the custom KTV subtitle renderer.
         */
        function handleSubtitleResize() {
            if (ktvSubtitle.classList.contains('plain-lyrics-mode')) renderKtvSubtitle();
            else fitSubtitleLineAnchors();
        }

        subtitleTrack.track.addEventListener('cuechange', renderKtvSubtitle);
        video.addEventListener('timeupdate', syncSubtitleSlotAtCurrentTime);
        video.addEventListener('play', requestPlainLyricsScroll);
        video.addEventListener('seeked', requestPlainLyricsScroll);
        window.addEventListener('resize', handleSubtitleResize);

        /** Clears the visible subtitle when playback leaves the current song. */
        function clearCurrentSubtitle() {
            subtitleTrack.track.mode = 'disabled';
            subtitleTrack.removeAttribute('src');
            ktvSubtitle.style.display = 'none';
            ktvSubtitle.classList.remove('plain-lyrics-mode');
            ktvSubtitle._plainLyricsState = null;
            ktvSubtitle.style.removeProperty('--plain-lyrics-width');
            ktvSubtitle.replaceChildren();
            currentFilename = '';
        }

        function isDualMediaSeekCorrectionActive() {
            return seekCorrectionEnabled && audioTrack;
        }

        function getDualMediaOffsetSeconds() {
            return Number.isFinite(currentSeekOffset) ? currentSeekOffset : 0;
        }

        function syncDualMediaTimeline() {
            if (!isDualMediaSeekCorrectionActive()) return;
            if (!Number.isFinite(audioTrack.currentTime) || !Number.isFinite(video.duration)) return;
            const offset = getDualMediaOffsetSeconds();
            const targetVideoTime = Math.max(0, audioTrack.currentTime - offset);
            const diff = Math.abs(video.currentTime - targetVideoTime);
            if (diff < 0.08) return;
            video.currentTime = Math.min(video.duration, targetVideoTime);
        }

        audioTrack.addEventListener('timeupdate', () => {
            if (!isDualMediaSeekCorrectionActive()) return;
            const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
            if (now - lastDualSyncTime < 120) return;
            lastDualSyncTime = now;
            syncDualMediaTimeline();
        });

        /**
         * In dual-media seek-correction mode only the audioTrack should remain audible.
         * Keeping the video element unmuted causes the same song to play twice and
         * masks the active channel mode switch (original / guide / instrumental).
         */
        function syncMediaMuteState() {
            const dualMode = isDualMediaSeekCorrectionActive();
            if (video) video.muted = dualMode;
            if (audioTrack) audioTrack.muted = !dualMode;
        }

        function resetAudioGraph() {
            if (liveLoudnessTimer) {
                window.clearInterval(liveLoudnessTimer);
                liveLoudnessTimer = null;
            }
            if (liveLoudnessAnalyser) {
                try { liveLoudnessAnalyser.disconnect(); } catch (error) {}
                liveLoudnessAnalyser = null;
            }
            liveLoudness = null;
            if (source) {
                try { source.disconnect(); } catch (error) {}
                source = null;
            }
            if (splitter) {
                try { splitter.disconnect(); } catch (error) {}
                splitter = null;
            }
            if (merger) {
                try { merger.disconnect(); } catch (error) {}
                merger = null;
            }
            if (masterGain) {
                try { masterGain.disconnect(); } catch (error) {}
                masterGain = null;
            }
            if (soundTouchNode) {
                try { soundTouchNode.disconnect(); } catch (error) {}
                soundTouchNode = null;
            }
            if (pitchShift && typeof pitchShift.dispose === 'function') {
                try { pitchShift.dispose(); } catch (error) {}
            }
            isAudioSetup = false;
            audioSetupPromise = null;
        }

        /** Smoothly stops media before clearing its source to prevent speaker clicks. */
        function stopMediaWithFade(stopGeneration) {
            const fadeDuration = 0.03;
            if (masterGain && audioCtx) {
                const now = audioCtx.currentTime;
                masterGain.gain.cancelScheduledValues(now);
                masterGain.gain.setValueAtTime(masterGain.gain.value, now);
                masterGain.gain.linearRampToValueAtTime(0, now + fadeDuration);
            }
            window.setTimeout(() => {
                if (stopGeneration !== playbackGeneration) return;
                video.pause();
                if (isDualMediaSeekCorrectionActive()) audioTrack.pause();
                video.src = '';
                video.load();
                if (isDualMediaSeekCorrectionActive()) audioTrack.src = '';
                if (masterGain && audioCtx) {
                    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
                }
            }, fadeDuration * 1000);
        }

        function reloadCurrentSongForDualMedia() {
            if (!currentFilename) return;
            const songUrl = "/songs/" + encodeURIComponent(currentFilename) + "?t=" + new Date().getTime();
            resetAudioGraph();
            const previousMode = currentMode;
            video.pause();
            audioTrack.pause();
            video.src = songUrl;
            audioTrack.src = songUrl;
            video.muted = true;
            audioTrack.muted = false;
            video.addEventListener('loadedmetadata', () => {
                setupAudio().then(() => {
                    configureSourceChannels();
                    return Promise.all([video.play(), audioTrack.play()]);
                }).catch(() => {
                    overlay.innerText = '⚠️ 請點擊畫面開始播放';
                });
            }, { once: true });
            video.load();
            audioTrack.load();
            currentMode = previousMode;
        }

        function initAudioContext() {
            if(!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            waiting.innerText = "🔊 音效引擎已啟動，等待點歌...";
            waiting.style.color = "#4CAF50";
            if (pendingPlaybackData && video.paused) {
                const playbackData = pendingPlaybackData;
                pendingPlaybackData = null;
                handlePlayVideo(playbackData);
            }
        }

        /**
         * Builds the KTV Web Audio graph with SoundTouch pitch processing.
         * @returns {Promise<void>} Resolves after the AudioWorklet is connected.
         */
        async function setupAudio() {
            if(isAudioSetup) return;
            if(audioSetupPromise) return audioSetupPromise;
            if(!audioCtx) initAudioContext();
            audioSetupPromise = (async () => {
                const mediaElement = isDualMediaSeekCorrectionActive() ? audioTrack : video;
                source = audioCtx.createMediaElementSource(mediaElement);
                source.channelInterpretation = 'discrete';
                splitter = audioCtx.createChannelSplitter(6);
                splitter.channelInterpretation = 'discrete';
                merger = audioCtx.createChannelMerger(2);
                merger.channelInterpretation = 'discrete';
                audioGains = Array.from({ length: 6 }, () => audioCtx.createGain());
                legacyStereoGains = Array.from({ length: 2 }, () => audioCtx.createGain());
                guideMixGain = audioCtx.createGain();
                legacyGuideGain = audioCtx.createGain();
                legacyGuideGain.gain.value = 0;
                instrumentalModeGain = audioCtx.createGain();
                instrumentalModeGain.gain.value = 0;
                masterGain = audioCtx.createGain();
                useSoundTouch = Boolean(audioCtx.audioWorklet);
                if (useSoundTouch) {
                    const { SoundTouchNode } = await soundTouchModulePromise;
                    await SoundTouchNode.register(audioCtx, soundTouchProcessorUrl);
                    soundTouchNode = new SoundTouchNode({ context: audioCtx });
                    soundTouchNode.playbackRate.value = 1;
                    setEngineStatus('SoundTouch AudioWorklet');
                } else {
                    Tone.setContext(audioCtx);
                    pitchShift = new Tone.PitchShift({ pitch: currentKey, windowSize: 0.3, delayTime: 0.03, feedback: 0 }).toDestination();
                    pitchShift.wet.value = currentKey === 0 ? 0 : 1;
                    setEngineStatus('Tone.js fallback（HTTP LAN）');
                }
                setAudioKey(currentKey);

                source.connect(splitter);
                // Keep all layout paths connected; per-song gains select stereo, legacy 5.1, or vocal-stem 5.1.
                audioGains.forEach((gain, channel) => {
                    splitter.connect(gain, channel);
                    if (channel === 2 || channel === 4) gain.connect(guideMixGain);
                    if (channel === 2) gain.connect(legacyGuideGain);
                    if (channel === 4) gain.connect(instrumentalModeGain);
                    if (channel !== 2 && channel !== 4) gain.connect(merger, 0, channel % 2);
                });
                legacyStereoGains.forEach((gain, channel) => {
                    splitter.connect(gain, channel);
                    gain.connect(merger, 0, 0);
                    gain.connect(merger, 0, 1);
                });
                guideMixGain.connect(merger, 0, 0);
                guideMixGain.connect(merger, 0, 1);
                legacyGuideGain.connect(merger, 0, 0);
                legacyGuideGain.connect(merger, 0, 1);
                instrumentalModeGain.connect(merger, 0, 0);
                instrumentalModeGain.connect(merger, 0, 1);
                merger.connect(masterGain);
                liveLoudnessAnalyser = audioCtx.createAnalyser();
                liveLoudnessAnalyser.fftSize = 2048;
                masterGain.connect(liveLoudnessAnalyser);
                if (useSoundTouch) masterGain.connect(soundTouchNode).connect(audioCtx.destination);
                else Tone.connect(masterGain, pitchShift);
                masterGain.gain.value = currentVolume;
                isAudioSetup = true;
                setAudioMode(currentMode);
                liveLoudnessTimer = window.setInterval(updateLiveLoudness, 250);
            })();
            return audioSetupPromise;
        }

        /**
         * Applies the KTV key as a SoundTouch pitch ratio at the current audio time.
         * @param {number} semitones Signed semitone offset from the original key.
         */
        function setAudioKey(semitones) {
            const value = Number(semitones);
            if (!Number.isFinite(value) || !audioCtx) return;
            const bounded = Math.max(-12, Math.min(12, value));
            if (useSoundTouch && soundTouchNode) {
                const ratio = 2 ** (bounded / 12);
                const now = audioCtx.currentTime;
                soundTouchNode.pitch.setValueAtTime(ratio, now);
                soundTouchNode.pitchSemitones.setValueAtTime(0, now);
            } else if (pitchShift) {
                pitchShift.pitch = bounded;
                pitchShift.wet.rampTo(bounded === 0 ? 0 : 1, 0.03);
            }
        }

        /**
         * Restores the six-channel media source after the video metadata is loaded.
         */
        function configureSourceChannels() {
            if (!source || !isSixChannelAudio) return;
            try {
                source.channelCountMode = 'explicit';
                source.channelCount = 6;
                if (isAudioSetup) setAudioMode(currentMode);
            } catch (error) {
                source.channelCountMode = 'max';
            }
        }

        socket.on('connect', () => { overlay.innerText = "✅ 已連線主機"; });

        socket.on('connect', () => {
            socket.emit('request_engine_status_config');
            if (!window.engineStatusSyncTimer) {
                window.engineStatusSyncTimer = window.setInterval(() => socket.emit('request_engine_status_config'), 1000);
            }
        });

        socket.on('engine_status_config', (data) => {
            engineDebugEnabled = Boolean(data && data.debug);
            engineStatus.classList.toggle('debug-visible', engineDebugEnabled);
            renderEngineStatus();
        });

        socket.on('seek_correction', (data) => {
            const enabled = Boolean(data && data.enabled);
            const wasDual = seekCorrectionEnabled;
            seekCorrectionEnabled = enabled;
            currentSeekOffset = 0;
            syncMediaMuteState();
            updatePlaybackModeStatus(seekCorrectionEnabled ? 'dual' : 'single');
            if (!seekCorrectionEnabled) {
                audioTrack.pause();
                audioTrack.src = '';
                return;
            }
            if (enabled && !wasDual && currentFilename) {
                reloadCurrentSongForDualMedia();
            }
        });

        function handlePlayVideo(data) {
            const generation = ++playbackGeneration;
            pendingPlaybackData = data;
            updatePlaybackModeStatus(isDualMediaSeekCorrectionActive() ? 'dual' : 'single');
            waiting.style.display = 'none';
            const songName = stripFileExtension(data.filename || data.title || '');
            overlay.innerText = songName ? `正在播放: ${songName}` : `正在播放: ${data.title}`;
            currentMode = data.track_mode || currentMode || 'original';
            isSixChannelAudio = Number(data.audio_channels) >= 6;
            guideVocalControlSupported = Boolean(data.guide_vocal_control);
            currentVocalLevel = Number.isFinite(Number(data.vocal_level)) ? Number(data.vocal_level) : 50;
            currentChannelLayout = data.audio_channel_layout || '';
            currentLoudness = Number.isFinite(Number(data.audio_loudness_lufs)) ? Number(data.audio_loudness_lufs) : null;
            setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            showSongAnnouncement(data.filename);
            updateKeyStatus(currentKey);
            setSubtitle(data.filename, Number(data.subtitle_mode) || 0);
            video.pause();
            audioTrack.pause();
            const songUrl = "/songs/" + encodeURIComponent(data.filename) + "?t=" + new Date().getTime();
            if (isDualMediaSeekCorrectionActive()) {
                syncMediaMuteState();
                video.src = songUrl;
                audioTrack.src = songUrl;
                video.addEventListener('loadedmetadata', () => {
                    if (generation !== playbackGeneration || !pendingPlaybackData) return;
                    setupAudio().then(() => {
                        if (generation !== playbackGeneration) return;
                        configureSourceChannels();
                        return Promise.all([video.play(), audioTrack.play()]);
                    }).catch(() => {
                        pendingPlaybackData = data;
                        overlay.innerText = "⚠️ 請點擊畫面開始播放";
                    });
                }, { once: true });
                video.load();
                audioTrack.load();
            } else {
                audioTrack.src = '';
                video.src = songUrl;
                video.addEventListener('loadedmetadata', () => {
                    if (generation !== playbackGeneration || !pendingPlaybackData) return;
                    setupAudio().then(() => {
                        if (generation !== playbackGeneration) return;
                        configureSourceChannels();
                        return video.play();
                    }).catch(() => {
                        pendingPlaybackData = data;
                        overlay.innerText = "⚠️ 請點擊畫面開始播放";
                    });
                }, { once: true });
                video.load();
            }
        }

        socket.on('play_video', handlePlayVideo);

        socket.on('queue_song_added', (data) => showQueueAddAnnouncement(data.filename));
        socket.on('danmaku_show', (data) => {
            if (data && data.text) showDanmaku(data.text);
        });
        socket.on('sound_effect', (data) => playSoundEffect(data && data.effect));
        socket.on('photo_show', showPhoto);
        socket.on('sticker_show', showSticker);

        socket.on('update_queue', (playlist) => {
            currentQueueHistory = Array.isArray(playlist) ? playlist : [];
            renderEngineStatus();
        });

        socket.on('subtitle_state', (data) => {
            if (data.filename === currentFilename) {
                setSubtitle(data.filename, Number(data.subtitle_mode) || 0);
                applySubtitleFontSize(data.font_size);
            }
        });

        socket.on('subtitle_style_mode', (data) => applySubtitleStyleMode(data && data.mode));

        socket.on('current_song', (data) => {
            applySubtitleMode(Number(data.subtitle_mode) || 0);
            applySubtitleFontSize(data.font_size);
        });

        socket.on('command', (cmd) => {
            if (cmd === 'pause') {
                if (isDualMediaSeekCorrectionActive()) {
                    if (video.paused) Promise.all([video.play(), audioTrack.play()]);
                    else { video.pause(); audioTrack.pause(); }
                } else {
                    if (video.paused) video.play();
                    else video.pause();
                }
            }
            if (cmd === 'stop') {
                playbackGeneration += 1;
                stopMediaWithFade(playbackGeneration);
                waiting.style.display = 'block';
                overlay.innerText = "⏹ 已停止";
                songAnnouncement.classList.remove('visible');
                clearTimeout(announcementTimer);
            }
        });

        socket.on('stop_video', (data) => {
            if (data && data.filename && data.filename !== currentFilename) return;
            playbackGeneration += 1;
            pendingPlaybackData = null;
            clearCurrentSubtitle();
            stopMediaWithFade(playbackGeneration);
            currentFilename = '';
            waiting.style.display = 'block';
            overlay.innerText = "⏹ 已停止";
            songAnnouncement.classList.remove('visible');
            clearTimeout(announcementTimer);
        });

        socket.on('seek_video', (data) => {
            const seconds = Number(data.seconds);
            const offset = Number(data.offset);
            if (!Number.isFinite(seconds)) return;
            currentSeekOffset = Number.isFinite(offset) ? offset : 0;
            if (isDualMediaSeekCorrectionActive()) {
                const audioNow = Number.isFinite(audioTrack.currentTime) ? audioTrack.currentTime : 0;
                const targetTime = Math.max(0, audioNow - getDualMediaOffsetSeconds());
                video.currentTime = Math.max(0, Math.min(video.duration || Infinity, targetTime));
            } else {
                const targetTime = seconds === 0 ? video.currentTime : video.currentTime - seconds;
                video.currentTime = Math.max(0, Math.min(video.duration || Infinity, targetTime));
            }
            updateSeekStatus(currentSeekOffset);
        });

        // 只跳轉仍在播放的曲目；雙媒體時維持原有音畫偏移。
        socket.on('seek_song', (data) => {
            const seconds = Number(data && data.seconds);
            if (seekCorrectionEnabled || !Number.isFinite(seconds) || !data.filename || data.filename !== currentFilename) return;
            const dualMode = isDualMediaSeekCorrectionActive();
            const playbackTime = dualMode ? audioTrack.currentTime : video.currentTime;
            if (!Number.isFinite(playbackTime) || !Number.isFinite(video.duration)) return;
            const maxTime = dualMode && Number.isFinite(audioTrack.duration)
                ? Math.min(video.duration, audioTrack.duration)
                : video.duration;
            const targetTime = Math.max(0, Math.min(maxTime, playbackTime + seconds));
            if (dualMode) {
                audioTrack.currentTime = targetTime;
                video.currentTime = Math.max(0, Math.min(video.duration, targetTime - getDualMediaOffsetSeconds()));
            } else {
                video.currentTime = targetTime;
            }
        });

        function requestAudioMode(mode, requestId = null) {
            const safeMode = ['original', 'guide', 'instrumental'].includes(mode) ? mode : 'original';
            const token = requestId === null ? ++audioModeRequestId : requestId;
            currentMode = safeMode;
            if (requestId === null) {
                audioModeRequestId = token;
            }
            if (!isAudioSetup || !audioGains || !audioCtx) return;
            if (token !== audioModeRequestId) return;
            const now = audioCtx.currentTime;
            const transitionEnd = now + 0.02;
            const channels = isSixChannelAudio
                ? (safeMode === 'guide' ? (guideVocalControlSupported ? [2, 4] : [2]) : safeMode === 'instrumental' ? [4] : [0, 1])
                : (safeMode === 'instrumental' ? [1] : safeMode === 'guide' ? [0, 1] : [0]);
            audioGains.forEach((gain) => {
                const channelIndex = audioGains.indexOf(gain);
                gain.gain.cancelScheduledValues(now);
                gain.gain.setValueAtTime(gain.gain.value, now);
                const channelGain = isSixChannelAudio && channels.includes(channelIndex)
                    ? (guideVocalControlSupported && safeMode === 'guide' && channelIndex === 2 ? currentVocalLevel / 100 : 1)
                    : 0;
                gain.gain.linearRampToValueAtTime(channelGain, transitionEnd);
            });
            legacyStereoGains.forEach((gain, channelIndex) => {
                gain.gain.setTargetAtTime(!isSixChannelAudio && channels.includes(channelIndex) ? 1 : 0, transitionEnd, 0.01);
            });
            if (guideMixGain) {
                const guideGain = guideVocalControlSupported && safeMode === 'guide' ? 1 : 0;
                guideMixGain.gain.cancelScheduledValues(now);
                guideMixGain.gain.setValueAtTime(guideMixGain.gain.value, now);
                guideMixGain.gain.linearRampToValueAtTime(guideGain, transitionEnd);
            }
            if (instrumentalModeGain) {
                instrumentalModeGain.gain.setTargetAtTime(
                    isSixChannelAudio && safeMode === 'instrumental' ? 1 : 0,
                    transitionEnd,
                    0.01,
                );
            }
            if (legacyGuideGain) {
                legacyGuideGain.gain.setTargetAtTime(
                    isSixChannelAudio && !guideVocalControlSupported && safeMode === 'guide' ? 1 : 0,
                    transitionEnd,
                    0.01,
                );
            }
            currentActiveChannels = channels.map((channel) => `c${channel}`).join(',');
            setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            overlay.innerText = safeMode === 'guide' ? "🎵 目前模式：導唱" : safeMode === 'instrumental' ? "🚫 目前模式：伴奏" : "🎤 目前模式：原聲";
        }

        socket.on('set_audio', (data) => {
            const mode = typeof data === 'string' ? data : data.mode;
            const requestId = Number.isFinite(Number(data && data.request_id)) ? Number(data.request_id) : null;
            const safeMode = ['original', 'guide', 'instrumental'].includes(mode) ? mode : 'original';
            if (data && typeof data === 'object') {
                if (typeof data.guide_vocal_control === 'boolean') guideVocalControlSupported = data.guide_vocal_control;
                if (Number.isFinite(Number(data.vocal_level))) currentVocalLevel = Number(data.vocal_level);
            }
            if (requestId !== null) {
                audioModeRequestId = Math.max(audioModeRequestId, requestId);
            }
            currentMode = safeMode;
            if (data && typeof data === 'object' && Number.isFinite(Number(data.audio_loudness_lufs))) {
                currentLoudness = Number(data.audio_loudness_lufs);
                setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            }
            requestAudioMode(safeMode, requestId !== null ? requestId : ++audioModeRequestId);
        });

        socket.on('set_vocal_level', (data) => {
            if (!Number.isFinite(Number(data && data.level))) return;
            currentVocalLevel = Math.max(0, Math.min(100, Number(data.level)));
            if (guideVocalControlSupported && currentMode === 'guide' && audioGains && audioCtx) {
                const now = audioCtx.currentTime;
                audioGains[2].gain.cancelScheduledValues(now);
                audioGains[2].gain.setTargetAtTime(currentVocalLevel / 100, now, 0.03);
            }
        });

        socket.on('apply_effect', (data) => {
            if (data.volume !== undefined) {
                currentVolume = Math.max(0, Math.min(2, Number(data.volume)));
                if (masterGain) {
                    masterGain.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.1);
                }
                setEngineStatus(useSoundTouch ? 'SoundTouch AudioWorklet' : 'Tone.js fallback（HTTP LAN）');
            }
            if (data.pitch !== undefined) {
                const pitch = Number(data.pitch);
                if (!Number.isFinite(pitch)) return;
                currentKey = Math.max(-12, Math.min(12, pitch));
                updateKeyStatus(currentKey);
                setAudioKey(currentKey);
            }
            if (data.playback_rate !== undefined) {
                const rate = Number(data.playback_rate);
                if (Number.isFinite(rate)) video.playbackRate = rate;
            }
        });

        /**
         * Selects one stereo pair from a six-channel KTV stream or the legacy L/R stream.
         * @param {string} mode Playback mode: original, guide, or instrumental.
         */
        function setAudioMode(mode) {
            requestAudioMode(mode, audioModeRequestId);
        }
        document.body.addEventListener('click', initAudioContext);
    </script>
</body>
</html>
