services:
  - type: web
    name: ianautoktv
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 240 --bind 0.0.0.0:$PORT render_app:application
    healthCheckPath: /healthz
    envVars:
      - key: IANAUTOKTV_CLOUD_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_PROJECT_NUMBER
        sync: false
      - key: QNAP_SHARE_URL
        sync: false
      - key: QNAP_SHARE_PASSWORD
        sync: false
